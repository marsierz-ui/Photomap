name = "photo-map"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Binds the private bucket to this Worker. No public access is enabled on the
# bucket itself, so the Worker is the only way in.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "photomap"   # change if your bucket has a different name

# PASSWORD_HASH and SESSION_SECRET are secrets, not plain vars.
# Set them with `wrangler secret put NAME` - never commit them here.
