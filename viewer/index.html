    container: box, style: globeStyle(), center:[10,25], zoom:1.4, minZoom:0, maxZoom:19,
    attributionControl:{ compact:true },
    dragRotate:false, pitchWithRotate:false, touchPitch:false, boxZoom:false,
    maxTileCacheZoomLevels:3,
  });
  G.map.addControl(new G.lib.NavigationControl({ showCompass:false }), 'top-left');
  // style.load, not load: load also waits for the first painted frame, and a
  // background tab is given no frames at all.
  G.map.on('style.load', () => {
    G.ready = true;
    G.booting = false;
    globeWire();
    if (mode === 'globe') drawMap();
  });
  G.map.on('error', (e) => console.warn('globe:', e.error?.message || e.type));
}

function globeWire() {
  G.map.on('mousemove', 'photos', (e) => {
    if (!G.map.isMoving()) globeHover(e.features[0]);   // a drag is a spin, not a hover
  });
  G.map.on('mouseleave', 'photos', () => globeHover(null));
  G.map.on('movestart', () => globeHover(null));
  G.map.on('click', 'photos', (e) => {
    const i = positionOf(e.features[0].properties.id);
    if (i >= 0) openPhoto(i);
  });
  G.map.on('webglcontextlost', () => setStatus('The globe lost its graphics context - it will come back on its own'));
  G.map.on('webglcontextrestored', () => { if (mode === 'globe') drawMap(); });
}

function globeHover(feature) {
  if (!G.map) return;
  const point = feature
    ? { id:feature.properties.id, ts:feature.properties.ts ?? null,
        lon:feature.geometry.coordinates[0], lat:feature.geometry.coordinates[1] }
    : null;
  if (point?.id === G.hovered?.id) return;
  G.hovered = point;
  G.map.getCanvas().style.cursor = point ? 'pointer' : '';
  G.map.setFilter('photo-hover', ['==', ['get','id'], point ? point.id : -1]);
  clearTimeout(G.timer);
  if (!point) { globeTip(null); return; }
  // Sweeping across the globe crosses dozens of photos; showing each one would
  // fire a thumbnail request per photo crossed. Wait for the pointer to settle.
  G.timer = setTimeout(() => globeTip(point), 110);
}

function globeTip(point) {
  if (!G.tip) {
    G.tip = document.createElement('div');
    G.tip.className = 'globe-tip hidden';
    // Built once and reused: rewriting innerHTML per hover throws the <img>
    // away and reloads the same picture from scratch.
    G.tip.innerHTML = '<img width="130" alt=""><div class="small muted"></div>';
    $('globe').appendChild(G.tip);
  }
  if (!point) { G.tip.classList.add('hidden'); return; }
  const i = positionOf(point.id);
  if (i < 0) return;
  const image = G.tip.firstChild;
  const url = `t/${M.th[i]}.jpg`;
  if (image.getAttribute('src') !== url) {
    image.setAttribute('src', url);
    image.onload = () => { if (G.hovered?.id === point.id) globePlace(point); };
  }
  G.tip.lastChild.textContent = fmtDT(point.ts);
  G.tip.classList.remove('hidden');
  globePlace(point);
}

/** Over the photo it belongs to, never hanging off the edge of the pane. */
function globePlace(point) {
  const rect = $('globe').getBoundingClientRect();
  const at = G.map.project([point.lon, point.lat]);
  const w = G.tip.offsetWidth, h = G.tip.offsetHeight;
  const above = at.y - h - 14;
  const clamp = (v, limit) => Math.max(6, Math.min(limit, v));
  G.tip.style.left = `${clamp(at.x - w / 2, rect.width - w - 6)}px`;
  G.tip.style.top = `${clamp(above >= 6 ? above : at.y + 18, rect.height - h - 6)}px`;
}

/** Both colours ride along on every point, so switching between them is a paint
 *  property rather than a rebuild of the whole set. */
function globeData(idx) {
  const cache = new Map();
  return { type:'FeatureCollection', features: idx.map((i) => {
    const ts = M.ts[i];
    const day = ts ? Math.floor(ts / 86400) : -1;
    let c = cache.get(day);
    if (!c) { c = dayColor(ts); cache.set(day, c); }
    return { type:'Feature', geometry:{ type:'Point', coordinates:[M.lon[i], M.lat[i]] },
             properties:{ id:M.ids[i], ts, c } };
  }) };
}

/** The trip line, mirroring the flat map's Path exactly: capture order, the
 *  active album's colour (or the base colour with none selected), and the same
 *  point-count ceiling - a line is a trip at thousands of points and a scribble
 *  at hundreds of thousands, and the browser would rather not lay out either
 *  more than once per draw. Unlike the point layers it is never capped to
 *  MAX_POINTS: that cap exists so tens of thousands of circles stay paintable,
 *  and a LineString of the same length costs one geometry, not one draw call
 *  per vertex. */
function globeSetPath(idx) {
  if (!G.ready) return;
  const source = G.map.getSource('path');
  if (!source) return;
  if (showPath && idx.length > 1 && idx.length <= MAX_PATH) {
    const ordered = [...idx].sort((a, b) => (M.ts[a] || 0) - (M.ts[b] || 0));
    G.map.setPaintProperty('path-line', 'line-color', albumColor());
    source.setData({ type:'Feature', properties:{},
      geometry:{ type:'LineString', coordinates: ordered.map((i) => [M.lon[i], M.lat[i]]) } });
  } else {
    source.setData(GLOBE_EMPTY);
    if (showPath && idx.length > MAX_PATH) {
      toast(`Path hidden: ${fmtNum(idx.length)} points exceeds the ${fmtNum(MAX_PATH)} limit`);
    }
  }
}

/** The same photos the flat map pins in amber, on the same filters. Kept in
 *  step with drawUploads deliberately: a photo added here should be in the same
 *  place whichever of the two modes is on screen. */
function globeSetAdded() {
  if (!G.ready) return;
  const source = G.map.getSource('added');
  if (!source) return;
  const shown = uploads.filter((u) => u.lat != null
    && (u.taken_ts || 0) <= cutoff
    && (!query || u.name.toLowerCase().includes(query)));
  source.setData(shown.length ? { type:'FeatureCollection', features: shown.map((u) => ({
    type:'Feature', geometry:{ type:'Point', coordinates:[u.lon, u.lat] }, properties:{},
  })) } : GLOBE_EMPTY);
}

function globeShow(idx) {
  $('globe').classList.remove('hidden');
  if (!G.ready) { globeBoot(); return false; }
  const rect = $('globe').getBoundingClientRect();
  if (rect.width && rect.height) G.map.resize();
  globeHover(null);
  const capped = idx.slice(0, MAX_POINTS);
  G.map.getSource('photos').setData(capped.length ? globeData(capped) : GLOBE_EMPTY);
  globeSetPath(idx);
  globeSetAdded();
  return true;
}

function globeHide() {
  $('globe').classList.add('hidden');
  globeHover(null);
}

function globeFit(s, w, n, e) {
  if (G.map) G.map.fitBounds([[w, s], [e, n]], { padding:40, maxZoom:17, duration:1000 });
}

function globeSetSkin(name) {
  if (!GLOBE_SKINS[name]) return;
  G.skin = name;
  if (!G.ready) return;
  Object.entries(GLOBE_SKINS).forEach(([key, def]) => {
    G.map.setLayoutProperty(def.layer, 'visibility', key === name ? 'visible' : 'none');
  });
}

function globeSetDays() {
  if (!G.ready) return;
  G.map.setPaintProperty('photos', 'circle-color', globeTint());
  G.map.setPaintProperty('photo-hover', 'circle-color', globeTint());
}

// -------------------------------------------------------------------- gallery

const OVERSCAN = 3;              // rows kept live above and below the viewport
const MY = new Intl.DateTimeFormat(undefined, { year:'numeric', month:'short', timeZone:'UTC' });

let galleryIdx = [];             // positions in M, newest first, after filtering
let geo = { cols:1, tileW:0, stride:0, pad:8, gap:4 };
const liveTiles = new Map();     // position in galleryIdx -> element
let tileColors = new Map(), tileAlbums = new Map();

/** The same column count auto-fill would have chosen, but as numbers, so a
 *  photo's box can be worked out without it being in the document. */
function measure() {
  const cs = getComputedStyle($('gallery'));
  const num = (value, fallback) => parseFloat(value) || fallback;
  const gap = num(cs.getPropertyValue('--gap'), 4);
  // The tray of not-yet-synced photos sits above #gsizer in normal flow, so it
  // pushes the whole grid down. Folding its height in here fixes the window
  // maths, topOfRow and the rail together - they all read geo.padT.
  const padT = num(cs.paddingTop, 8) + $('uptray').offsetHeight;
  // #gsizer sits inside the padding, so only the width has to account for it.
  const inner = Math.max(0, $('gallery').clientWidth - num(cs.paddingLeft, 8) - num(cs.paddingRight, 42));
  const cols = Math.max(1, Math.floor((inner + gap) / (num(cs.getPropertyValue('--tile'), 130) + gap)));
  const tileW = (inner - (cols - 1) * gap) / cols;
  geo = { cols, tileW, stride: tileW + gap, padT, gap };
}

const topOfRow = (row) => geo.padT + row * geo.stride;

function place(node, k) {
  node.style.left = `${(k % geo.cols) * geo.stride}px`;
  node.style.top = `${Math.floor(k / geo.cols) * geo.stride}px`;
  node.style.width = `${geo.tileW}px`;
  node.style.height = `${geo.tileW}px`;
}

function makeTile(k) {
  const i = galleryIdx[k];
  const id = M.ids[i];
  const node = document.createElement('div');
  node.className = `tile${selection.has(id) ? ' sel' : ''}`;
  node.dataset.i = i;
  node.dataset.id = id;
  const dots = (tileAlbums.get(id) || [])
    .map((a) => `<i style="background:${tileColors.get(a)}"></i>`).join('');
  node.innerHTML = `<img loading="lazy" src="t/${M.th[i]}.jpg" alt="">
    <span class="pick"></span>
    ${M.fav[i] ? '<span class="star">★</span>' : ''}
    ${noteOf(i) ? '<span class="pen" title="Has a note">✎</span>' : ''}
    <span class="dots">${dots}</span>`;
  place(node, k);
  return node;
}

/** Bring the tiles around the viewport into the document and drop the rest. */
function paintWindow() {
  const g = $('gallery');
  const first = Math.max(0, Math.floor((g.scrollTop - geo.padT) / geo.stride) - OVERSCAN);
  const last = Math.floor((g.scrollTop + g.clientHeight - geo.padT) / geo.stride) + OVERSCAN;
  const from = first * geo.cols;
  const to = Math.max(from, Math.min(galleryIdx.length, (last + 1) * geo.cols));
  liveTiles.forEach((node, k) => {
    if (k < from || k >= to) { node.remove(); liveTiles.delete(k); }
  });
  const frag = document.createDocumentFragment();
  for (let k = from; k < to; k += 1) {
    if (liveTiles.has(k)) continue;
    const node = makeTile(k);
    liveTiles.set(k, node);
    frag.appendChild(node);
  }
  $('gsizer').appendChild(frag);
}

/** Re-measure and re-place. Tiles already on screen are moved rather than
 *  rebuilt, so turning the phone does not refetch what is already loaded. */
function layoutGallery() {
  measure();
  const rows = Math.ceil(galleryIdx.length / geo.cols);
  // One stride, not one row: the trailing gap is the slack under the last row.
  $('gsizer').style.height = `${rows * geo.stride}px`;
  liveTiles.forEach(place);
  paintWindow();
  drawRail();
}

// One object URL per photo, made once and kept until the photo leaves the tray.
// Both halves of that matter: an object URL lives until it is revoked, and the
// tray redraws on every gallery draw, so a camera roll's worth of them would be
// a leak measured in gigabytes - while revoking one whose <img> has not finished
// loading fails that load, which is what a revoke-and-rebuild pass does to the
// row it has just drawn.
const trayUrls = new Map();

/** Photos added here but not yet in the library. Painted above the grid rather
 *  than inside it: the grid is virtualised on the assumption that every tile is
 *  an index into M, and these are not in M. */
function drawUploadTray() {
  const tray = $('uptray');
  if (!uploads.length) { tray.innerHTML = ''; return; }
  const label = (u) => (u.state === 'done'
    ? (u.proxy_only ? 'sent, smaller copy' : 'sent · waiting for a sync')
    : (u.state === 'failed' ? (u.error || 'could not send') : 'uploading…'));
  // Newest first and capped: the older proxies have been dropped by now anyway,
  // to keep a long queue from filling the phone.
  const shown = uploads.slice(-KEEP_PREVIEWS).reverse();
  const live = new Set(shown.filter((u) => u.proxy).map((u) => u.id));
  trayUrls.forEach((url, id) => {
    if (live.has(id)) return;
    URL.revokeObjectURL(url);
    trayUrls.delete(id);
  });

  const head = uploads.length > shown.length
    ? `${fmtNum(uploads.length)} · showing the last ${fmtNum(shown.length)}`
    : fmtNum(uploads.length);
  tray.innerHTML = `<div class="uphead muted small">Added on this device · ${head}</div>`
    + `<div class="uprow">${shown.map((u) => {
      if (u.proxy && !trayUrls.has(u.id)) trayUrls.set(u.id, URL.createObjectURL(u.proxy));
      const src = u.proxy ? trayUrls.get(u.id) : '';
      return `<figure class="upcard${u.state === 'failed' ? ' bad' : ''}">
      ${src ? `<img alt="" src="${src}">` : '<div class="upblank"></div>'}
      <figcaption>${escapeHtml(u.name)}<br><span class="muted">${escapeHtml(label(u))}</span></figcaption>
    </figure>`;
    }).join('')}</div>`;
}

function drawGallery() {
  drawUploadTray();
  galleryIdx = visible();
  tileColors = new Map(M.albums.map((a) => [a.id, a.color]));
  tileAlbums = new Map();
  M.albums.forEach((a) => a.photos.forEach((p) => {
    if (!tileAlbums.has(p)) tileAlbums.set(p, []);
    tileAlbums.get(p).push(a.id);
  }));
  liveTiles.forEach((node) => node.remove());
  liveTiles.clear();
  $('gallery').scrollTop = 0;
  buildMarks();
  layoutGallery();
  $('status').textContent = `${fmtNum(galleryIdx.length)} shown of ${fmtNum(M.n)}`;
}

$('gallery').addEventListener('scroll', () => {
  if (!railDrag) paintWindow();
  railFollow();
});
$('gallery').addEventListener('load', (e) => e.target.classList.add('on'), true);
$('gallery').addEventListener('click', (e) => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  const id = Number(tile.dataset.id);
  if (e.target.classList.contains('pick') || e.ctrlKey || e.metaKey) {
    if (selection.has(id)) selection.delete(id); else selection.add(id);
    tile.classList.toggle('sel', selection.has(id));
    paintSel();
    return;
  }
  openPhoto(Number(tile.dataset.i));
});

function paintSel() {
  $('selbar').classList.toggle('hidden', selection.size === 0);
  $('selCount').textContent = `${fmtNum(selection.size)} selected`;
  $('selDelete').classList.toggle('hidden', !M?.allow_delete);
}

// ------------------------------------------------------------------ date rail

const RAIL_PAD = 14;      // keeps the first and last label off the ends
const RAIL_GAP = 15;      // closest two labels are allowed to sit
let marks = [];           // first position of each capture month, newest first
let railDrag = false;

/** One entry per month present, in a single pass: the gallery is already in
 *  capture order, so a photo inside the current month's range cannot start a
 *  new one and costs no Date. Undated photos sort to the end and get no mark. */
function buildMarks() {
  marks = [];
  let lo = Infinity, hi = -Infinity;
  for (let k = 0; k < galleryIdx.length; k += 1) {
    const t = M.ts[galleryIdx[k]];
    if (t >= lo && t < hi) continue;
    if (!t) break;
    const d = new Date(t * 1000);
    const y = d.getUTCFullYear(), m = d.getUTCMonth();
    lo = Date.UTC(y, m) / 1000;
    hi = Date.UTC(y, m + 1) / 1000;
    marks.push({ k, y, text: MONTHS[m] });
  }
}

/** Years first, because they are what the eye reaches for; months then fill any
 *  gap left wide enough to read. */
function railLabels(range) {
  const n = galleryIdx.length;
  const at = (k) => RAIL_PAD + (k / (n - 1)) * range;
  const out = [];
  let year = null, last = -Infinity;
  for (const mark of marks) {
    if (mark.y === year) continue;
    year = mark.y;
    const y = at(mark.k);
    if (y - last < RAIL_GAP) continue;
    out.push({ y, text:String(mark.y), big:true });
    last = y;
  }
  let p = 0;
  for (const mark of marks) {
    const y = at(mark.k);
    while (p < out.length && out[p].y < y) p += 1;
    if ((p > 0 ? y - out[p - 1].y : Infinity) < RAIL_GAP) continue;
    if ((p < out.length ? out[p].y - y : Infinity) < RAIL_GAP) continue;
    out.splice(p, 0, { y, text:mark.text, big:false });
  }
  return out;
}

function drawRail() {
  const rail = $('rail'), g = $('gallery');
  const useful = view === 'gallery' && galleryIdx.length > 1 && marks.length
                 && g.scrollHeight - g.clientHeight > 8;
  rail.classList.toggle('hidden', !useful);
  if (!useful) { $('railBubble').classList.add('hidden'); return; }
  rail.innerHTML = railLabels(railRange())
    .map((m) => `<b class="${m.big ? 'y' : ''}" style="top:${m.y.toFixed(1)}px">${m.text}</b>`)
    .join('');
}

const railRange = () => Math.max(1, $('rail').clientHeight - 2 * RAIL_PAD);

function bubble(k) {
  const b = $('railBubble');
  const t = M.ts[galleryIdx[k]];
  b.textContent = t ? MY.format(new Date(t * 1000)) : 'No date';
  // The bubble and the rail are both laid out against .view, but the rail is
  // pushed clear of the status bar on a phone, so its own offset has to count.
  b.style.top = `${$('rail').offsetTop + RAIL_PAD + (k / (galleryIdx.length - 1)) * railRange()}px`;
  b.classList.remove('hidden');
}

/** Where the gallery is now, mirrored onto the rail. */
function railFollow() {
  if (galleryIdx.length < 2 || $('rail').classList.contains('hidden')) return;
  const row = Math.max(0, Math.round(($('gallery').scrollTop - geo.padT) / geo.stride));
  bubble(Math.min(galleryIdx.length - 1, row * geo.cols));
  clearTimeout(railFollow._t);
  if (!railDrag) railFollow._t = setTimeout(() => $('railBubble').classList.add('hidden'), 900);
}

/** The nearest month start within `tol` photos, or `k` untouched. A pixel of a
 *  full rail can be forty photos, so without this a tap on a year label lands a
 *  month either side of it and the bubble contradicts the label under the
 *  finger. In sparse years the months are pixels apart and nothing snaps. */
function snap(k, tol) {
  let lo = 0, hi = marks.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (marks[mid].k < k) lo = mid + 1; else hi = mid;
  }
  let best = k, dist = tol;
  for (const mark of [marks[lo - 1], marks[lo]]) {
    if (mark && Math.abs(mark.k - k) <= dist) { dist = Math.abs(mark.k - k); best = mark.k; }
  }
  return best;
}

function railTo(clientY) {
  const rect = $('rail').getBoundingClientRect();
  const range = railRange();
  const f = Math.max(0, Math.min(1, (clientY - rect.top - RAIL_PAD) / range));
  const last = galleryIdx.length - 1;
  const raw = Math.round(f * last);
  // The ends stay exact: the bottom of the rail is the oldest photo, not the
  // start of whichever month it happens to land in.
  const k = f > 0 && f < 1 ? snap(raw, Math.ceil((last * 4) / range)) : raw;
  // The scroll moves but the tiles do not: a drag across ten years would
  // otherwise ask for a thumbnail from every month it passed through. The
  // bubble says where you are, and the window is painted on release.
  $('gallery').scrollTop = topOfRow(Math.floor(k / geo.cols));
  bubble(k);
}

$('rail').addEventListener('pointerdown', (e) => {
  if (galleryIdx.length < 2) return;
  railDrag = true;
  $('rail').setPointerCapture(e.pointerId);
  e.preventDefault();
  railTo(e.clientY);
});
$('rail').addEventListener('pointermove', (e) => { if (railDrag) railTo(e.clientY); });
const railRelease = () => {
  if (!railDrag) return;
  railDrag = false;
  paintWindow();
  railFollow();
};
$('rail').addEventListener('pointerup', railRelease);
$('rail').addEventListener('pointercancel', railRelease);
// The rail covers the right edge of the gallery, and nothing under it scrolls,
// so a wheel over the strip has to be handed on.
$('rail').addEventListener('wheel', (e) => { $('gallery').scrollTop += e.deltaY; }, { passive:true });

// ------------------------------------------------------------------- lightbox

let shadeIndex = null;
function openPhoto(i) {
  shadeIndex = i;
  $('shade').style.display = 'flex';
  $('shade').querySelector('img').src = `t/${M.th[i]}.jpg`;
  $('shadeCap').textContent = fmtDT(M.ts[i]) + (M.lat[i] != null ? ` · ${M.lat[i].toFixed(4)}, ${M.lon[i].toFixed(4)}` : ' · no GPS');
  $('shadeFav').textContent = M.fav[i] ? '★ Favourited' : '☆ Favourite';
  $('shadeDelete').classList.toggle('hidden', !M.allow_delete);
  const field = $('shadeNote');
  field.value = noteOf(i);
  field.dataset.was = field.value;
  $('noteState').textContent = '';
}

/** Saves on the way out of the field, or on Ctrl+Enter. Only when it actually
 *  changed - closing a photo you only looked at should queue nothing. */
async function saveNote() {
  const i = shadeIndex;
  const field = $('shadeNote');
  if (i == null || field.value === field.dataset.was) return;
  const text = field.value.trim();
  $('noteState').textContent = 'Saving…';
  if (!await send({ op:'photo_note', photo_ids:[M.ids[i]], note:text })) {
    $('noteState').textContent = '';
    return;
  }
  if (!M.notes) M.notes = {};
  if (text) M.notes[M.ids[i]] = text; else delete M.notes[M.ids[i]];
  field.dataset.was = field.value;
  $('noteState').textContent = 'Saved - will sync to your laptop';
  if (view === 'gallery') drawGallery();
}
$('shadeNote').addEventListener('blur', saveNote);
$('shadeNote').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveNote(); }
  // Escape closes the lightbox, which would otherwise discard what was typed.
  if (e.key === 'Escape') e.stopPropagation();
});

const closeShade = () => { saveNote(); $('shade').style.display = 'none'; };
$('shadeClose').onclick = closeShade;
$('shade').onclick = (e) => { if (e.target.id === 'shade') closeShade(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeShade(); });
$('shadeFav').onclick = async () => {
  const i = shadeIndex;
  const value = !M.fav[i];
  if (await send({ op:'favorite', photo_ids:[M.ids[i]], value })) {
    M.fav[i] = value ? 1 : 0;
    openPhoto(i);
    toast(value ? 'Favourited - will sync to your laptop' : 'Unfavourited');
  }
};
$('shadeDelete').onclick = async () => {
  const i = shadeIndex;
  $('shade').style.display = 'none';
  await deletePhotos([i]);
};

// -------------------------------------------------------------- album actions

$('selFav').onclick = async () => {
  const ids = [...selection];
  if (await send({ op:'favorite', photo_ids:ids, value:true })) {
    const set = new Set(ids);
    M.ids.forEach((id, i) => { if (set.has(id)) M.fav[i] = 1; });
    toast(`${fmtNum(ids.length)} favourited - will sync to your laptop`);
    selection.clear(); paintSel(); refresh();
  }
};
$('selClear').onclick = () => { selection.clear(); paintSel(); refresh(); };
$('selDelete').onclick = () => {
  const wanted = new Set(selection);
  const indexes = [];
  for (let i = 0; i < M.n; i += 1) if (wanted.has(M.ids[i])) indexes.push(i);
  deletePhotos(indexes);
};
$('selAlbum').onclick = async () => {
  const names = M.albums.map((a, n) => `${n + 1}. ${a.name}`).join('\n');
  const answer = prompt(`Add ${selection.size} photos to which album?\n\n${names}\n\nEnter a number, or a new album name:`);
  if (!answer) return;
  const ids = [...selection];
  const asNumber = Number(answer);
  let ok;
  if (asNumber >= 1 && asNumber <= M.albums.length) {
    const album = M.albums[asNumber - 1];
    ok = await send({ op:'album_add', album_id:album.id, photo_ids:ids });
    if (ok) album.photos.push(...ids);
  } else {
    ok = await send({ op:'album_create', name:answer.trim(), photo_ids:ids });
    if (ok) M.albums.push({ id:-Date.now(), name:answer.trim(), color:'#ff5a5f', photos:ids });
  }
  if (ok) {
    toast(`${fmtNum(ids.length)} photos added - will sync to your laptop`);
    selection.clear(); paintSel(); fillAlbums(); refresh();
  }
};

// ---------------------------------------------------------------- panel/dupes

let dupeLimit = 60;

/** id -> position, rebuilt whenever the photo list changes under it. A linear
    indexOf per duplicate was fine at 60 sets and is not at several thousand. */
let idPos = null;
function positionOf(id) {
  if (!idPos || idPos.size !== M.n) {
    idPos = new Map();
    for (let i = 0; i < M.n; i += 1) idPos.set(M.ids[i], i);
  }
  const i = idPos.get(id);
  return i === undefined ? -1 : i;
}

function drawPanel() {
  const albums = M.albums.map((a) => `
    <div class="row" data-album="${a.id}">
      <span class="dot" style="background:${a.color}"></span>
      <span class="name">${escapeHtml(a.name)}</span>
      <span class="muted small">${fmtNum(a.photos.length)}</span>
    </div>`).join('') || '<div class="muted small">No albums yet</div>';

  const allDupes = M.dupes || [];
  const dupes = allDupes.slice(0, dupeLimit).map((d) => {
    const photos = d.ids.map((id) => {
      const i = positionOf(id);
      if (i < 0) return '';
      return `<div class="dupphoto${d.keep === id ? ' keep' : ''}" data-hash="${d.hash}" data-id="${id}">
        <img loading="lazy" src="t/${M.th[i]}.jpg" alt="">
        <span class="b">${d.keep === id ? 'Keep' : 'Remove'}</span>
      </div>`;
    }).join('');
    return `<div class="dupset" data-hash="${d.hash}">
      ${photos}
      <button data-resolve="${d.hash}" class="danger">Remove ${d.ids.length - 1} extra</button>
    </div>`;
  }).join('') || '<div class="muted small">No duplicates in this snapshot</div>';

  $('panel').innerHTML = `
    <div class="card"><h4>Albums</h4>${albums}</div>
    <div class="card">
      <h4>Duplicates ${(M.dupes || []).length ? `· ${fmtNum(M.dupes.length)} sets` : ''}</h4>
      <div class="muted small" style="margin-bottom:8px">
        One copy is always kept. Tap a photo to keep that one instead. Removals are applied
        on your laptop at the next sync, and the files go to its recycle bin.
      </div>
      ${dupes}
      ${allDupes.length > dupeLimit ? `<button id="moreDupes" style="margin-top:10px">
        Show more (${fmtNum(allDupes.length - dupeLimit)} sets left)</button>` : ''}
    </div>`;
}

$('panel').addEventListener('click', async (e) => {
  if (e.target.id === 'moreDupes') {
    dupeLimit += 60;
    drawPanel();
    return;
  }
  const albumRow = e.target.closest('[data-album]');
  if (albumRow) {
    albumFilter = Number(albumRow.dataset.album);
    $('album').value = String(albumFilter);
    setView('gallery');
    refresh();
    return;
  }
  const photo = e.target.closest('.dupphoto');
  if (photo) {
    const set = (M.dupes || []).find((d) => d.hash === photo.dataset.hash);
    if (set) { set.keep = Number(photo.dataset.id); drawPanel(); }
    return;
  }
  const button = e.target.closest('[data-resolve]');
  if (button) {
    const set = (M.dupes || []).find((d) => d.hash === button.dataset.resolve);
    if (!set) return;
    if (!confirm(`Remove ${set.ids.length - 1} extra copies? One copy is kept, and the files go to the recycle bin on your laptop.`)) return;
    if (await send({ op:'dupe_resolve', hash:set.hash, keep_id:set.keep })) {
      M.dupes = M.dupes.filter((d) => d.hash !== set.hash);
      toast('Queued - the extras go to the recycle bin at the next sync');
      drawPanel();
    }
  }
});

function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ------------------------------------------------------------------ insights

const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function fmtBytes(b) {
  if (!b) return '—';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let n = b, u = 0;
  while (n >= 1024 && u < units.length - 1) { n /= 1024; u += 1; }
  return `${n < 10 && u > 0 ? n.toFixed(1) : Math.round(n)} ${units[u]}`;
}

/** label/bar/count rows, scaled to the largest bucket. */
function bars(rows, dim = false) {
  const top = Math.max(1, ...rows.map((r) => r[1]));
  return `<div class="bars">${rows.map(([label, count]) => `
    <span class="lab">${escapeHtml(label)}</span>
    <span class="track"><i class="${dim ? 'dim' : ''}" style="width:${(count / top) * 100}%"></i></span>
    <span class="num">${fmtNum(count)}</span>`).join('')}</div>`;
}

function drawInsights() {
  const idx = visible();
  const n = idx.length;
  // The desktop buckets with SQLite's strftime(..., 'unixepoch'), which is UTC,
  // and this viewer already prints dates in UTC. Anything local-time here would
  // quietly disagree with the app on the laptop.
  const hour = new Array(24).fill(0);
  const dow = new Array(7).fill(0);
  const month = new Array(12).fill(0);
  const years = new Map();
  const cams = new Map();
  let geo = 0, favs = 0, bytes = 0, dated = 0, first = null, last = null;

  for (const i of idx) {
    if (M.lat[i] != null) geo += 1;
    if (M.fav[i]) favs += 1;
    if (M.sz) bytes += M.sz[i] || 0;
    if (M.cam && M.cams && M.cam[i] >= 0) {
      const name = M.cams[M.cam[i]];
      cams.set(name, (cams.get(name) || 0) + 1);
    }
    const t = M.ts[i];
    if (!t) continue;
    dated += 1;
    if (first === null || t < first) first = t;
    if (last === null || t > last) last = t;
    const d = new Date(t * 1000);
    hour[d.getUTCHours()] += 1;
    dow[d.getUTCDay()] += 1;
    month[d.getUTCMonth()] += 1;
    const y = d.getUTCFullYear();
    years.set(y, (years.get(y) || 0) + 1);
  }

  const pct = n ? Math.round((geo / n) * 100) : 0;
  const cameraRows = [...cams.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12);
  const yearRows = [...years.entries()].sort((a, b) => a[0] - b[0]).map(([y, c]) => [String(y), c]);

  // sz/cam arrive with manifest v3. An older snapshot still shows everything
  // else rather than rendering an empty or wrong card.
  const legacy = !M.sz || !M.cam;

  $('insights').innerHTML = `
    <div class="card">
      <h4>Overview</h4>
      <div class="figs">
        <div class="fig"><div class="v">${fmtNum(n)}</div><div class="k">photos shown</div></div>
        <div class="fig"><div class="v">${fmtNum(geo)}</div><div class="k">with GPS · ${pct}%</div></div>
        <div class="fig"><div class="v">${fmtNum(favs)}</div><div class="k">favourites</div></div>
        ${M.sz ? `<div class="fig"><div class="v">${fmtBytes(bytes)}</div><div class="k">on disk</div></div>` : ''}
        <div class="fig"><div class="v">${fmtDate(first)}</div><div class="k">earliest</div></div>
        <div class="fig"><div class="v">${fmtDate(last)}</div><div class="k">latest</div></div>
      </div>
      ${dated < n ? `<div class="muted small" style="margin-top:8px">
        ${fmtNum(n - dated)} without a capture date are left out of the breakdowns below.</div>` : ''}
      ${legacy ? `<div class="muted small" style="margin-top:8px">
        Disk usage and cameras need a newer snapshot - run a sync from the app on your computer.</div>` : ''}
    </div>
    <div class="card"><h4>By year</h4>${yearRows.length ? bars(yearRows) : '<div class="muted small">No dated photos</div>'}</div>
    <div class="card"><h4>By month</h4>${bars(month.map((c, i) => [MONTHS[i], c]))}</div>
    <div class="card"><h4>By weekday</h4>${bars(dow.map((c, i) => [DOW[i], c]))}</div>
    <div class="card"><h4>By hour of day</h4>${bars(hour.map((c, i) => [String(i).padStart(2, '0'), c]), true)}</div>
    ${cameraRows.length ? `<div class="card"><h4>Cameras</h4>${bars(cameraRows)}</div>` : ''}`;

  $('status').textContent = `${fmtNum(n)} shown of ${fmtNum(M.n)}`;
}

// -------------------------------------------------------------------- chrome

function setView(name) {
  view = name;
  // Both switchers carry data-view: the top tabs on a desktop, the bottom bar
  // on a phone. Only one of them is on screen at a time.
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
  $('map').classList.toggle('hidden', name !== 'map');
  $('gallery').classList.toggle('hidden', name !== 'gallery');
  $('panel').classList.toggle('hidden', name !== 'panel');
  $('insights').classList.toggle('hidden', name !== 'insights');
  $('mapControls').classList.toggle('hidden', name !== 'map');
  // The globe is its own element rather than a layer, so leaving the map has to
  // put it away explicitly or it stays painted over whatever comes next. The
  // layers go with it: a hidden map is a zero-size container, and leaflet.heat
  // redraws itself on the map's own moveend - straight into getImageData on a
  // zero-width canvas, which throws. drawMap() below puts them back on the way in.
  if (name !== 'map') { globeHide(); clearLayers(); }
  if (name !== 'gallery') { $('rail').classList.add('hidden'); $('railBubble').classList.add('hidden'); }
  if (name === 'map') { map.invalidateSize(); drawMap(); }
  if (name === 'gallery') drawGallery();
  if (name === 'panel') drawPanel();
  if (name === 'insights') drawInsights();
}

function refresh() {
  if (view === 'map') drawMap();
  else if (view === 'gallery') drawGallery();
  else if (view === 'insights') drawInsights();
  else drawPanel();
}

document.addEventListener('click', (e) => {
  // The filter sheet covers the tab bar while it is up, so anything outside it
  // has to put it away again - otherwise Done is the only way out.
  if (document.body.classList.contains('filters-on')
      && !e.target.closest('.foot, #filterBtn')) {
    document.body.classList.remove('filters-on');
  }
  const b = e.target.closest('[data-view]');
  if (b) setView(b.dataset.view);
});
$('filterBtn').onclick = () => document.body.classList.toggle('filters-on');
$('filterDone').onclick = () => document.body.classList.remove('filters-on');

const pressed = (group, button) =>
  [...group.children].forEach((x) => x.classList.toggle('active', x === button));

// -------------------------------------------------- remembering the map view
//
// On the device, in localStorage, rather than in the library. These are not
// library data: the phone and the laptop look at the same photos through very
// different screens, and a globe that suits one is not what the other wants to
// open on. Storing them per device also means there is nothing to send to the
// desktop and nothing to reconcile when two devices disagree.
//
// Filters are deliberately not here. A remembered date range or search would
// reopen the app showing a fraction of the library with no obvious reason why,
// and "no photos" is a bad first screen. Box select is left out for the same
// reason: it is a gesture you are in the middle of, not a preference.

const VIEW_KEY = 'photomap-view-v1';

function saveView() {
  try {
    const centre = map.getCenter();
    localStorage.setItem(VIEW_KEY, JSON.stringify({
      mode,
      base,
      skin: G.skin,
      path: showPath,
      days: byDay,
      radius: $('heatRadius').value,
      blur: $('heatBlur').value,
      intensity: $('heatIntensity').value,
      lat: centre.lat,
      lon: centre.lng,
      zoom: map.getZoom(),
    }));
  } catch {
    // Private browsing refuses to write, and a full quota throws too. Losing a
    // preference is not worth interrupting anyone over.
  }
}

/** Put a remembered view back before the first draw. Returns true if it also
 *  restored a position, so boot knows not to fit to the whole library. */
function applyView() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null');
  } catch {
    saved = null;
  }
  if (!saved || typeof saved !== 'object') return false;

  // Everything is checked against what the UI actually offers rather than
  // trusted: this is storage a user can edit, and a stale key from an older
  // version must not leave the app in a mode with no button for it.
  const modeBtn = $('mode').querySelector(`[data-mode="${CSS.escape(String(saved.mode || ''))}"]`);
  if (modeBtn) {
    mode = saved.mode;
    pressed($('mode'), modeBtn);
  }
  const baseBtn = $('base').querySelector(`[data-base="${CSS.escape(String(saved.base || ''))}"]`);
  if (baseBtn) {
    setBase(saved.base);
    pressed($('base'), baseBtn);
  }
  const skinBtn = $('globeSkin').querySelector(`[data-skin="${CSS.escape(String(saved.skin || ''))}"]`);
  if (skinBtn) {
    globeSetSkin(saved.skin);
    pressed($('globeSkin'), skinBtn);
  }
  showPath = !!saved.path;
  $('togglePath').classList.toggle('active', showPath);
  byDay = !!saved.days;
  $('toggleDays').classList.toggle('active', byDay);

  [['heatRadius', saved.radius], ['heatBlur', saved.blur], ['heatIntensity', saved.intensity]]
    .forEach(([id, value]) => {
      const input = $(id);
      const n = Number(value);
      if (Number.isFinite(n) && n >= Number(input.min) && n <= Number(input.max)) {
        input.value = String(n);
      }
    });
  syncModeControls();

  const { lat, lon, zoom } = saved;
  if (Number.isFinite(lat) && Number.isFinite(lon) && Number.isFinite(zoom)
      && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
    map.setView([lat, lon], Math.min(Math.max(zoom, 0), map.getMaxZoom()));
    return true;
  }
  return false;
}

// Panning and zooming are the two settings nobody thinks to press a button for,
// so they are saved from the map itself. Debounced: a pinch-zoom fires moveend
// repeatedly and localStorage writes are synchronous.
map.on('moveend zoomend', () => {
  clearTimeout(saveView._t);
  saveView._t = setTimeout(saveView, 400);
});

/** Which controls belong to the mode on screen. Shared by the mode buttons and
 *  by restoring a remembered mode, so the two cannot drift apart. */
function syncModeControls() {
  // Only the two per-photo renderings can carry a colour per photo; a heat map
  // has no per-point colour and a cluster pin is a summary of several days.
  $('toggleDays').classList.toggle('hidden', mode !== 'points' && mode !== 'globe');
  $('heatCtl').classList.toggle('hidden', mode !== 'heat');
  $('base').classList.toggle('hidden', mode === 'globe');
  $('globeSkin').classList.toggle('hidden', mode !== 'globe');
  $('boxSelect').classList.toggle('hidden', mode === 'globe');
}

$('mode').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  mode = b.dataset.mode;
  pressed(e.currentTarget, b);
  syncModeControls();
  drawMap();
  saveView();
};
$('base').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  setBase(b.dataset.base);
  pressed(e.currentTarget, b);
  saveView();
};
$('globeSkin').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  globeSetSkin(b.dataset.skin);
  pressed(e.currentTarget, b);
  saveView();
};
$('togglePath').onclick = (e) => {
  showPath = !showPath;
  e.currentTarget.classList.toggle('active', showPath);
  drawMap();
  saveView();
};
$('toggleDays').onclick = (e) => {
  byDay = !byDay;
  e.currentTarget.classList.toggle('active', byDay);
  globeSetDays();
  drawMap();
  saveView();
};
$('boxSelect').onclick = (e) => {
  armed = !armed;
  e.currentTarget.classList.toggle('active', armed);
  map.getContainer().classList.toggle('selecting', armed);
};
['heatRadius', 'heatBlur', 'heatIntensity'].forEach((id) => {
  $(id).addEventListener('input', () => { if (heatLayer) heatLayer.setOptions(heatOptions()); });
  // On the slider's own change rather than every input event: dragging a range
  // fires input per pixel, and none of those intermediate values is a choice.
  $(id).addEventListener('change', saveView);
});
$('fit').onclick = fit;
$('range').oninput = (e) => {
  const pct = Number(e.target.value) / 100;
  cutoff = M.first_ts + (M.last_ts - M.first_ts) * pct;
  $('stamp').textContent = pct >= 1 ? 'all time' : `up to ${fmtDate(cutoff)}`;
  refresh();
};
// Scanning 26,000 names on every keystroke is fine, but redrawing the map or a
// gallery page for each one is not, so the filter waits for a pause in typing.
$('search').oninput = (e) => {
  const next = e.target.value.trim().toLowerCase();
  clearTimeout($('search')._t);
  $('search')._t = setTimeout(() => {
    if (next === query) return;
    query = next;
    refresh();
  }, 180);
};
$('album').onchange = (e) => { albumFilter = e.target.value ? Number(e.target.value) : null; refresh(); };
$('favOnly').onchange = (e) => { favOnly = e.target.checked; refresh(); };
window.addEventListener('resize', () => { if (view === 'gallery') layoutGallery(); });

function fillAlbums() {
  $('album').innerHTML = '<option value="">All photos</option>'
    + M.albums.map((a) => `<option value="${a.id}">${escapeHtml(a.name)} (${a.photos.length})</option>`).join('');
  if (albumFilter) $('album').value = String(albumFilter);
}

// ------------------------------------------------------------------ installed

// The service worker keeps the page, the snapshot and every thumbnail you have
// already looked at available with no signal. It is registered unconditionally:
// unlike a dev server, this file is only ever served from the bucket.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
  });
}

const paintOnline = () => $('offline').classList.toggle('hidden', navigator.onLine);
window.addEventListener('online', paintOnline);
window.addEventListener('offline', paintOnline);
paintOnline();

// Chrome and Edge offer installation through this event; iOS has no equivalent
// and needs Share -> Add to Home Screen, so there is nothing to show there.
let installPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e;
  $('install').classList.remove('hidden');
});
$('install').onclick = () => {
  $('install').classList.add('hidden');
  installPrompt?.prompt();
  installPrompt = null;
};
window.addEventListener('appinstalled', () => $('install').classList.add('hidden'));

// ---------------------------------------------------------------------- boot

fetch('manifest.json', { cache:'no-cache' })
  .then((r) => { if (!r.ok) throw new Error(`manifest.json returned ${r.status}`); return r.json(); })
  .then(async (m) => {
    M = m;
    if (!M.ids) throw new Error('This snapshot predates gallery support - run a sync from the app');
    $('loading').style.display = 'none';
    $('summary').textContent =
      `${fmtNum(m.n)} photos · ${fmtNum(m.geo_n)} located · updated ${fmtDate(m.generated)}`;
    $('stamp').textContent = 'all time';
    fillAlbums();
    // Adding photos is off unless this snapshot came from a machine that opted
    // in, so an older snapshot simply has no button.
    if (m.allow_import) $('addPhotos').classList.remove('hidden');
    // Never fatal: a phone that refuses IndexedDB (private mode, storage
    // denied) still gets the whole viewer, just without adding photos.
    try {
      await loadUploads();
      await retireDrained();
    } catch {
      $('addPhotos').classList.add('hidden');
    }
    // Before setView, so the first draw is already in the remembered mode
    // rather than drawing a heat map and then replacing it.
    const restored = applyView();
    setView('map');
    // Fitting to the whole library is the right opening move only the first
    // time. After that, where you left the map is a better answer than where
    // all the photos are.
    if (!restored && m.bounds) {
      map.fitBounds([[m.bounds[0], m.bounds[1]], [m.bounds[2], m.bounds[3]]], { padding:[40,40], maxZoom:15 });
    }
    paintUploads();
    // Anything left over from last time goes now. Reported only when it fails:
    // opening the app should not raise a panel about a queue that emptied
    // itself, but a queue that cannot empty has been silent for far too long.
    if (m.allow_import) reportDrain(await drainUploads(), null);
  })
  .catch((err) => {
    $('loading').querySelector('div').textContent = 'Could not load the snapshot';
    $('loadErr').textContent = `${err.message}. If this is the first run, sync from the Photo Map app once.`;
  });
</script>
</body>
</html>
