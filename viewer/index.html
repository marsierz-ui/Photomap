<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Map</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗺️</text></svg>">
<!-- Installable. Every path here is relative, so the app still resolves if the
     bucket is ever served from a subpath rather than the root of a Worker. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<!-- iOS ignores the manifest for these: without them "Add to Home Screen"
     makes a Safari bookmark rather than a standalone app, and takes a
     screenshot of the page as the icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo Map">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Served from the bucket, not a CDN. A cross-origin script is one the service
     worker cannot cache, which left the installed app with no map at all when
     it was offline - the one thing it exists to survive. -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/leaflet/MarkerCluster.css">
<style>
:root { --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#2a323d;
        --text:#e6edf3; --muted:#8b97a6; --accent:#4aa3ff; --radius:6px;
        /* Zero everywhere except an installed app on a notched phone, where the
           status bar and home indicator sit over the page. */
        --top:env(safe-area-inset-top, 0px); --bottom:env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { height:100%; margin:0; background:var(--bg); color:var(--text);
             font:13px/1.45 system-ui,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
/* dvh, not vh: iOS Safari counts the address bar in vh, so the bottom row would
   sit under it until the first scroll. The last row is the mobile tab bar,
   which collapses to nothing while it is display:none. */
body { display:grid; grid-template-columns:100%; height:100dvh;
       grid-template-rows:calc(46px + var(--top)) 1fr auto auto; }

.bar { display:flex; align-items:center; gap:8px; padding:var(--top) 10px 0; background:var(--panel);
       border-bottom:1px solid var(--line); overflow:hidden; }
.bar > * { flex-shrink:0; }
#chips { display:flex; align-items:center; gap:8px; }
.title { font-weight:650; }
.spacer { flex:1; }
.muted { color:var(--muted); }
.small { font-size:11px; }
.hidden { display:none !important; }
.chip { border:1px solid var(--line); border-radius:99px; padding:2px 9px; font-size:11px;
        background:var(--panel-2); color:var(--muted); white-space:nowrap; }
.chip.warn { border-color:#5c4a2a; color:#ffd08a; }

button, select, input { font:inherit; color:inherit; }
button, select { background:var(--panel-2); border:1px solid var(--line);
                 border-radius:var(--radius); padding:5px 10px; cursor:pointer; }
button:disabled { opacity:.45; cursor:default; }
button.active { background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:600; }
button.danger { border-color:#5c2a2c; color:#ff9ea1; }
.seg { display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.seg button { border:0; border-radius:0; }
.tabs button { background:transparent; border:1px solid transparent; color:var(--muted); }
.tabs button.on { background:var(--panel-2); border-color:var(--line); color:var(--text); }

.view { position:relative; min-height:0; overflow:hidden; }
#map, #gallery, #panel, #insights, #globe { position:absolute; inset:0; }
#map { background:#0b0e13; }
#globe { background:#080b11; }
/* Leaflet keeps its zoom and attribution controls above everything in its pane,
   so they would sit on top of the globe. Hidden, not removed: it would lose
   track of its size, and something has to be under the globe while it loads. */
#map.under-globe { visibility:hidden; }

.controls .seg { background:var(--panel); }
.controls .seg button { font-size:11px; padding:4px 7px; }
.controls > button { font-size:11px; padding:4px 8px; }
.heatctl { margin:0; padding:7px 9px; width:150px; }
.heatctl label { display:block; font-size:10px; color:var(--muted); margin-bottom:3px; }
.heatctl input { width:100%; margin:0 0 4px; }
.box-select { position:absolute; z-index:800; border:1px dashed var(--accent);
              background:rgba(74,163,255,.15); pointer-events:none; }
.selecting, .selecting .leaflet-grab { cursor:crosshair; }
.globe-tip { position:absolute; top:0; left:0; z-index:600; pointer-events:none;
             background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
             padding:6px; box-shadow:0 6px 18px rgba(0,0,0,.55); }
.globe-tip img { display:block; border-radius:3px; }
/* Only the screenful in view exists as DOM. The grid is uniform, so a photo's
   box is arithmetic rather than layout, and a 26,000-photo library costs about
   forty tiles instead of 26,000. The date rail needs that anyway: it can only
   map a month to a scroll offset if the whole list has a height. */
/* The padding is real rather than a custom property because the phone adds the
   safe-area inset to the top of it, and a custom property holding a calc() is
   never resolved - getComputedStyle hands back the text. A padding is. */
#gallery { overflow-y:auto; overflow-x:hidden; padding:8px 42px 0 8px;
           --tile:130px; --gap:4px; }
#gsizer { position:relative; }
#panel, #insights { overflow-y:auto; padding:12px; }

/* Date rail: a scrollbar that knows what month it is on. Dragging it scrubs the
   gallery. Labels sit at the offset of the first photo of each year, and months
   fill whatever room is left between them. */
.rail { position:absolute; top:0; right:0; bottom:0; width:34px; z-index:620;
        touch-action:none; -webkit-user-select:none; user-select:none; }
.rail b { position:absolute; right:5px; transform:translateY(-50%); pointer-events:none;
          font:600 10px/1 system-ui; color:var(--muted); }
.rail b.y { color:var(--text); font-size:11px; }
.railbubble { position:absolute; right:40px; z-index:640; transform:translateY(-50%);
              background:var(--accent); color:#06121f; font:600 12px/1 system-ui;
              border-radius:99px; padding:5px 11px; white-space:nowrap; pointer-events:none;
              box-shadow:0 6px 18px rgba(0,0,0,.5); }

/* Insights. Bars are a grid rather than a chart library: one row per bucket,
   label / bar / count, so it stays readable at phone width. */
.figs { display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:8px; }
.fig { background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px; }
.fig .v { font-size:17px; font-weight:650; }
.fig .k { color:var(--muted); font-size:11px; }
.bars { display:grid; grid-template-columns:auto 1fr auto; gap:3px 8px; align-items:center; }
.bars .lab { color:var(--muted); font-size:11px; white-space:nowrap; }
.bars .num { color:var(--muted); font-size:11px; text-align:right; font-variant-numeric:tabular-nums; }
.bars .track { background:var(--panel-2); border-radius:3px; height:13px; overflow:hidden; }
.bars .track i { display:block; height:100%; background:var(--accent); border-radius:3px; }
.bars .track i.dim { background:#3a4757; }

/* Photos added on this device, above the grid. Amber throughout, matching the
   map pins: not yet in the library, and visibly so. */
#uptray:empty { display:none; }
.uphead { padding:2px 0 6px; }
.uprow { display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; }
.upcard { margin:0; width:104px; flex:0 0 auto; background:var(--panel-2);
          border:1px solid #ffb020; border-radius:4px; overflow:hidden; }
.upcard.bad { border-color:var(--bad, #ff9ea1); }
.upcard img, .upblank { width:100%; height:78px; object-fit:cover; display:block; }
.upblank { background:var(--panel); }
.upcard figcaption { font-size:10px; line-height:1.3; padding:3px 4px;
                     overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.tile { position:absolute; background:#0b0e13; border-radius:4px;
        overflow:hidden; cursor:pointer; border:2px solid transparent; }
.tile img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .18s; }
.tile img.on { opacity:1; }
.tile.sel { border-color:var(--accent); }
.tile .pick { position:absolute; top:5px; left:5px; width:16px; height:16px; border-radius:50%;
              border:2px solid rgba(255,255,255,.8); background:rgba(0,0,0,.35); }
.tile.sel .pick { background:var(--accent); border-color:#fff; }
.tile .star { position:absolute; top:4px; right:5px; font-size:12px; color:#ffd166; }
.tile .dots { position:absolute; bottom:4px; left:5px; display:flex; gap:3px; }
.tile .dots i { width:8px; height:8px; border-radius:50%; box-shadow:0 0 0 1px rgba(0,0,0,.5); }

.controls { position:absolute; top:10px; right:10px; z-index:500; display:flex;
            flex-direction:column; gap:6px; align-items:flex-end; }
.status { position:absolute; bottom:10px; left:10px; z-index:500; background:rgba(22,27,34,.92);
          border:1px solid var(--line); border-radius:var(--radius); padding:5px 10px;
          font-size:11px; color:var(--muted); }

.foot { background:var(--panel); border-top:1px solid var(--line); padding:7px 10px;
        display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
#range { flex:1; min-width:140px; }
.addrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

button.danger { border-color:#5c2a2c; color:#ff9ea1; }
.selbar { position:fixed; left:50%; bottom:74px; transform:translateX(-50%); z-index:1200;
          display:flex; align-items:center; gap:8px; background:var(--panel);
          border:1px solid var(--line); border-radius:99px; padding:7px 14px;
          box-shadow:0 8px 28px rgba(0,0,0,.55); max-width:calc(100vw - 16px); flex-wrap:wrap; }

.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
        padding:10px; margin-bottom:10px; }
.card h4 { margin:0 0 8px; font-size:12px; color:var(--muted); }
.row { display:flex; align-items:center; gap:8px; padding:5px 4px; border-radius:4px; cursor:pointer; }
.row:hover { background:var(--panel-2); }
.row .dot { width:10px; height:10px; border-radius:50%; flex:none; }
.row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dupset { display:flex; gap:6px; flex-wrap:wrap; align-items:flex-start;
          border-bottom:1px solid var(--line); padding:8px 0; }
.dupphoto { width:96px; cursor:pointer; border:2px solid transparent; border-radius:5px;
            padding:3px; background:var(--panel-2); }
.dupphoto.keep { border-color:#3fb950; background:#16241a; }
.dupphoto img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:3px; display:block; }
.dupphoto .b { font-size:9px; font-weight:600; display:block; text-align:center; margin-top:3px; }
.dupphoto.keep .b { color:#7ee2a8; }
.dupphoto .b { color:#ff9ea1; }

.pin i { display:block; width:10px; height:10px; margin:2px; border-radius:50%;
         background:var(--accent); border:1px solid rgba(255,255,255,.85); }
.marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
  background:rgba(74,163,255,.85); color:#06121f; font:600 11px system-ui; }
.marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background:rgba(74,163,255,.25); }
.leaflet-popup-content-wrap, .leaflet-popup-tip { background:var(--panel); color:var(--text); border:1px solid var(--line); }
.leaflet-popup-content img { display:block; border-radius:4px; max-width:220px; height:auto; }

#shade { position:fixed; inset:0; z-index:3000; background:rgba(6,8,12,.96);
         display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; }
#shade img { max-width:94vw; max-height:76vh; border-radius:6px; }
#shade .bar2 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
#shade .notewrap { display:flex; flex-direction:column; gap:3px; width:min(520px,94vw); }
#shadeNote { width:100%; resize:vertical; background:var(--panel-2); border:1px solid var(--line);
             border-radius:var(--radius); padding:8px; color:inherit; font:inherit; }
.tile .pen { position:absolute; bottom:4px; right:5px; font-size:11px; color:#cfe3ff;
             text-shadow:0 0 3px rgba(0,0,0,.8); }
#search { min-width:150px; flex:1; background:var(--panel-2); border:1px solid var(--line);
          border-radius:var(--radius); padding:5px 9px; }

#toast { position:fixed; bottom:80px; left:12px; right:12px; z-index:3500; margin:auto;
         max-width:460px; background:var(--panel); border:1px solid var(--line);
         border-left:3px solid var(--accent); border-radius:var(--radius); padding:9px 13px;
         display:none; align-items:center; justify-content:space-between; gap:8px; }
#toast.err { border-left-color:#e5484d; }

/* Adding photos. The bar runs while a batch does; the result panel stays until
   it is dismissed, because a toast is gone in three seconds and the reason an
   upload failed is the one thing worth reading twice. */
#upbar { position:fixed; bottom:80px; left:12px; right:12px; z-index:3400; margin:auto;
         max-width:460px; background:var(--panel); border:1px solid var(--line);
         border-radius:var(--radius); padding:9px 12px; display:none; }
#upbar.on { display:block; }
#upbar .row { display:flex; align-items:center; gap:8px; }
#upbar .what { flex:1; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#upbar .pct { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
#upbar button { font-size:11px; padding:3px 8px; }
#upbar .track { background:var(--panel-2); border-radius:3px; height:6px; overflow:hidden; margin-top:8px; }
#upbar .track i { display:block; height:100%; width:0; background:var(--accent); border-radius:3px; }
/* Indeterminate: reading a photo reports no fraction of its own, and a bar
   parked at one width looks like a bar that has stopped. */
#upbar .track.idle i { width:35% !important; animation:slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { margin-left:-35%; } 100% { margin-left:100%; } }

#upresult { position:fixed; bottom:80px; left:12px; right:12px; z-index:3450; margin:auto;
            max-width:460px; background:var(--panel); border:1px solid var(--line);
            border-left:3px solid var(--accent); border-radius:var(--radius);
            padding:11px 13px; display:none; max-height:50vh; overflow:auto; }
#upresult.on { display:block; }
#upresult.bad { border-left-color:#e5484d; }
#upresult h4 { margin:0 0 4px; font-size:13px; }
#upresult ul { margin:6px 0 0; padding-left:17px; color:var(--muted); font-size:12px; }
#upresult li { margin:3px 0; }
#upresult .acts { display:flex; gap:6px; margin-top:10px; }

#confirm { position:fixed; inset:0; z-index:4200; background:rgba(4,6,10,.75);
           display:none; align-items:center; justify-content:center; padding:12px; }
#confirm .box { background:var(--panel); border:1px solid var(--line); border-radius:8px;
                padding:18px; width:min(440px,100%); max-height:86vh; overflow:auto; }
#confirm h3 { margin:0 0 10px; font-size:16px; }
#confirm .thumbs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; align-items:center; }
#confirm .thumbs img { width:58px; height:58px; object-fit:cover; border-radius:4px; }
#confirm .thumbs .more { color:var(--muted); font-size:12px; padding:0 6px; }
#confirm input { width:100%; box-sizing:border-box; background:var(--panel-2);
                 border:1px solid var(--line); border-radius:6px; padding:9px; margin-bottom:10px; }
#confirm .acts { display:flex; gap:8px; justify-content:flex-end; }
#confirm .danger { background:#3a1e20; border-color:#5c2a2c; color:#ff9ea1; font-weight:600; }
.loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
           background:var(--bg); z-index:4000; flex-direction:column; gap:10px; }
.err { color:#ff9ea1; max-width:420px; text-align:center; }

/* Bottom navigation, phone only. Hidden on desktop, where the tabs live in the
   top bar; its grid row costs nothing while it is display:none. */
.tabbar { display:none; background:var(--panel); border-top:1px solid var(--line);
          padding-bottom:var(--bottom); }
.tabbar button { position:relative; flex:1; background:transparent; border:0; border-radius:0;
                 color:var(--muted); display:flex; flex-direction:column; align-items:center;
                 gap:3px; padding:7px 0 6px; font-size:11px; }
.tabbar button.on { color:var(--accent); }
.tabbar .ico { font-size:17px; line-height:1; }
/* Upload trouble is inside the sheet now, so the tab that opens it has to say
   there is something to open it for. */
.tabbar button.alert::after { content:''; position:absolute; top:6px; left:calc(50% + 9px);
                              width:7px; height:7px; border-radius:50%; background:#e5484d; }
#filterDone { display:none; }

/* One breakpoint. Below it the top tabs move to the bottom bar, the filter row
   becomes a sheet over the map, and the confirmation dialog goes edge to edge. */
@media (max-width:768px) {
  .title, .bar .tabs, #summary { display:none; }
  #gallery { --tile:104px; }
  .tabbar { display:flex; }

  /* No top bar on a phone. The tabs are in the bottom bar and the title and
     summary were already hidden, so the row was 46px of nothing. It collapses
     to nothing at all - not to the notch inset, which is still a band of panel
     colour where a phone reports one - and the map runs to the top edge of the
     screen. Only what would then sit under the status bar is pushed clear of
     it: the map's own controls, the date rail, and the scrolling views. */
  body { grid-template-rows:0 1fr auto auto; }
  .bar { padding:0; border-bottom:0; }
  #chips { position:fixed; top:calc(var(--top) + 8px); left:50%;
           transform:translateX(-50%); z-index:1500; }
  .controls { top:calc(10px + var(--top)); }
  .leaflet-top, .maplibregl-ctrl-top-left { margin-top:var(--top); }
  .rail { top:var(--top); }
  #gallery { padding-top:calc(8px + var(--top)); }
  #panel, #insights { padding-top:calc(12px + var(--top)); }

  /* Filters slide up over the map rather than taking the screen, so the map
     keeps redrawing behind them while the time range moves. */
  .foot { position:fixed; left:0; right:0; bottom:0; z-index:2100;
          flex-direction:column; align-items:stretch; gap:10px;
          padding:14px 14px calc(14px + var(--bottom));
          transform:translateY(103%); transition:transform .2s ease;
          box-shadow:0 -14px 34px rgba(0,0,0,.55); }
  body.filters-on .foot { transform:none; }
  .foot select, .foot #range, #filterDone, .addrow { width:100%; }
  .addrow #addPhotos { flex:1; padding:9px; }
  .foot label { padding:4px 0; }
  #filterDone { display:block; }

  /* Box select wants a mouse drag, which is the gesture the map already uses
     for panning on a touch screen - and it listens for mouse events a phone
     never sends. Hidden rather than left as a button that does nothing. */
  #boxSelect { display:none; }

  .selbar, #toast, #upbar, #upresult { bottom:calc(72px + var(--bottom)); }
  #shade img { max-height:66vh; }
  #shade .bar2 { padding:0 10px calc(10px + var(--bottom)); }

  #confirm { padding:0; }
  #confirm .box { width:100%; height:100%; max-height:none; border-radius:0;
                  padding:18px; padding-top:calc(18px + var(--top)); }
}
</style>
</head>
<body>

<header class="bar">
  <span class="title">Photo&nbsp;Map</span>
  <div class="tabs seg">
    <button data-view="map" class="on">Map</button>
    <button data-view="gallery">Gallery</button>
    <button data-view="panel">Albums</button>
    <button data-view="insights">Insights</button>
  </div>
  <span class="spacer"></span>
  <span id="chips">
    <span id="offline" class="chip warn hidden">Offline</span>
    <button id="install" class="hidden">Install</button>
  </span>
  <!-- No `capture`: it forces the camera and takes multi-select away. The
       accept list is image/* alone on purpose - naming .heic here is what tells
       iOS to hand over the original HEIC instead of transcoding it to a JPEG,
       and a JPEG is the one thing every part of this can read. -->
  <input id="picker" type="file" accept="image/*" multiple hidden>
  <span id="summary" class="muted small"></span>
</header>

<div class="view">
  <div id="map"></div>
  <div id="gallery" class="hidden"><div id="uptray"></div><div id="gsizer"></div></div>
  <div id="panel" class="hidden"></div>
  <div id="insights" class="hidden"></div>
  <div id="globe" class="hidden"></div>
  <div id="rail" class="rail hidden"></div>
  <div id="railBubble" class="railbubble hidden"></div>
  <div class="controls" id="mapControls">
    <div class="seg" id="mode">
      <button data-mode="heat" class="active">Heat</button>
      <button data-mode="cluster">Clusters</button>
      <button data-mode="points">Points</button>
      <button data-mode="globe">Globe</button>
    </div>
    <div class="seg" id="base">
      <button data-base="dark" class="active">Dark</button>
      <button data-base="streets">Streets</button>
      <button data-base="satellite">Satellite</button>
    </div>
    <div class="seg hidden" id="globeSkin">
      <button data-skin="map" class="active">Map</button>
      <button data-skin="streets">Streets</button>
      <button data-skin="satellite">Satellite</button>
    </div>
    <div class="seg">
      <button id="togglePath">Path</button>
      <button id="toggleDays" class="hidden">Days</button>
      <button id="boxSelect">Box</button>
    </div>
    <button id="fit">Fit to photos</button>
    <div class="card heatctl" id="heatCtl">
      <label>Radius <input type="range" id="heatRadius" min="1" max="40" value="22"></label>
      <label>Blur <input type="range" id="heatBlur" min="1" max="40" value="16"></label>
      <label>Intensity <input type="range" id="heatIntensity" min="1" max="30" value="10"></label>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<footer class="foot">
  <input type="search" id="search" placeholder="Search filenames and notes"
         autocomplete="off" autocapitalize="off" spellcheck="false">
  <select id="album"><option value="">All photos</option></select>
  <label class="small muted"><input type="checkbox" id="favOnly"> ★ only</label>
  <input type="range" id="range" min="0" max="100" value="100">
  <span id="stamp" class="muted small"></span>
  <!-- Adding photos lives in here rather than over the map. On a phone the top
       bar is gone entirely, so anything left in it floats across the view it is
       meant to be showing - next to the map's own controls, which is where the
       Add button and the upload state used to sit. -->
  <div class="addrow" id="addrow">

<script>
const $ = (id) => document.getElementById(id);
const DF = new Intl.DateTimeFormat(undefined, { year:'numeric', month:'short', day:'numeric', timeZone:'UTC' });
const DTF = new Intl.DateTimeFormat(undefined, { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'UTC' });
const fmtDate = (t) => t ? DF.format(new Date(t * 1000)) : '—';
const fmtDT = (t) => t ? DTF.format(new Date(t * 1000)) : '—';
const fmtNum = (n) => Number(n || 0).toLocaleString();

let M = null;                 // manifest
let view = 'map', mode = 'heat';
let cutoff = Infinity, albumFilter = null, favOnly = false, query = '';
const selection = new Set();
const pending = [];           // changes queued locally, mirrored into the view

function toast(msg, isErr) {
  const t = $('toast');
  t.innerHTML = '';
  t.appendChild(Object.assign(document.createElement('span'), { textContent: msg }));
  t.classList.toggle('err', !!isErr);
  t.style.display = 'flex';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = 'none'; }, isErr ? 6000 : 3000);
}

/** Queue a change for the desktop app to pick up on its next sync. */
async function send(change) {
  // Queued changes live in the bucket, so there is nowhere to put one offline.
  // Saying so beats a generic failure after the request times out.
  if (!navigator.onLine) {
    toast('Offline - favourites and albums need a connection', true);
    return false;
  }
  try {
    const r = await fetch('/api/change', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(change),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    pending.push(change);
    send.lastKey = data.key || null;
    return true;
  } catch (e) {
    toast(`Could not save: ${e.message}`, true);
    send.lastKey = null;
    return false;
  }
}

// ----------------------------------------------------------- adding photos
//
// A photo picked here is NOT put into M. M's arrays are index-aligned and every
// view walks them by position, so appending to them would mean touching each of
// those walks and getting them all right; a separate list that the map and the
// gallery each draw once is far less to go wrong.
//
// Each photo travels as two objects: a small proxy first, so the pin appears
// immediately, then the full-resolution original. The desktop collects both on
// its next sync and the phone's copy is dropped once the snapshot says it
// arrived.
//
// The picker is the phone's own, and no web app can reach a camera roll without
// it, so choosing everything stays a gesture the person holding the phone
// makes. What follows does not: everything picked that is already in the
// library, or that this device has handed over before, is passed over without
// being read, so "select all" is a thing you can do every time.

const uploads = [];              // photos added on this device, kept out of M
const PROXY_EDGE = 1600;         // long edge of the proxy, in px
const PROXY_QUALITY = 0.82;
// How far the reader may run ahead of the uploader. A whole camera roll staged
// in one go is thousands of proxies parked on the phone waiting for a computer
// to collect them, which is the phone's own storage quota rather than anything
// this app can apologise for, so the queue is kept short and refilled.
const STAGE_AHEAD = 20;
// Previews kept for the tray. A proxy is a quarter of a megabyte or so; one per
// photo of a five thousand photo roll is not a preview strip, it is a disk.
const KEEP_PREVIEWS = 24;
let uploadsFull = false;         // the bucket refused: nothing more fits
let uploadLayer = null;
let picking = null;              // {done, total} while a picked batch is read

const DB_NAME = 'photomap-uploads';
const DB_VERSION = 2;
let updb = null;

// Fingerprints of every photo this device has handed to the bucket. Deliberately
// kept apart from the records above: those are dropped the moment the computer
// has collected them, and without a memory that outlives them, picking the whole
// camera roll again would send every photo a second time.
const sent = new Set();

function store(name, mode) {
  return updb.transaction(name, mode).objectStore(name);
}

function openUploads() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const handle = req.result;
      // Checked rather than assumed: this also runs as an upgrade from the
      // version that had photos and nothing else.
      if (!handle.objectStoreNames.contains('photos')) {
        handle.createObjectStore('photos', { keyPath: 'id' });
      }
      if (!handle.objectStoreNames.contains('sent')) {
        handle.createObjectStore('sent', { keyPath: 'key' });
      }
    };
    req.onsuccess = () => { updb = req.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}

const idbDo = (request) => new Promise((resolve, reject) => {
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});

async function loadUploads() {
  await openUploads();
  const rows = await idbDo(store('photos', 'readonly').getAll());
  // Oldest first, so a queue drains in the order the photos were picked.
  rows.sort((a, b) => a.queued_ts - b.queued_ts).forEach((r) => uploads.push(r));
  (await idbDo(store('sent', 'readonly').getAllKeys())).forEach((key) => sent.add(key));
}

const saveUpload = (rec) => idbDo(store('photos', 'readwrite').put(rec));
const dropUpload = (rec) => idbDo(store('photos', 'readwrite').delete(rec.id));

/** Two fingerprints per photo, and both are exact.
 *
 *  The first costs nothing at all - name, size and modified time come off the
 *  File without reading a byte of it - which is what makes filtering five
 *  thousand picked photos instant. The second is the digest of the bytes, and
 *  it is what still recognises a photo the phone handed over under a different
 *  name the second time. */
const fileKey = (file) => `f|${file.name.toLowerCase()}|${file.size}|${file.lastModified}`;
const hashKey = (digest) => `h|${digest}`;

/** What the library already holds, by name and size.
 *
 *  Both fields are in the snapshot already, so knowing this costs nothing on
 *  the wire. It is the check that catches the photos copied off this phone by
 *  cable months ago: same name, same byte count, already on the computer. */
let libraryKeys = null;
function inLibrary(file) {
  if (!libraryKeys) {
    libraryKeys = new Set();
    // `sz` arrived with manifest v3; against an older snapshot this simply
    // matches nothing and the desktop catches the duplicates instead.
    if (M.name && M.sz) {
      M.name.forEach((name, i) => libraryKeys.add(`${name.toLowerCase()}|${M.sz[i]}`));
    }
  }
  return libraryKeys.has(`${file.name.toLowerCase()}|${file.size}`);
}

/** Whether this device has dealt with this file already: handed it over on an
 *  earlier visit, or holding it in the queue right now. */
function alreadyMine(file) {
  const key = fileKey(file);
  return sent.has(key) || uploads.some((u) => u.file_key === key);
}

/** Recorded the moment the bucket accepts the photo, and never forgotten. Not
 *  at the moment it is picked: an upload that failed outright has to be worth
 *  picking again. */
async function remember(rec) {
  for (const key of [rec.file_key, hashKey(rec.sha256)]) {
    if (!key || sent.has(key)) continue;
    sent.add(key);
    try {
      await idbDo(store('sent', 'readwrite').put({ key, ts: Date.now() }));
    } catch {
      // The set still holds it for this session, so the batch in hand is not
      // affected; a later visit offers the photo again and the computer drops it.
    }
  }
}

/** Drop the previews of photos that are safely in the bucket, keeping the few
 *  the tray actually shows. The record itself stays: it is what puts the pin on
 *  the map and what says the photo is still waiting for the computer. */
async function trimPreviews() {
  const held = uploads.filter((u) => u.state === 'done' && u.proxy);
  for (const rec of held.slice(0, Math.max(0, held.length - KEEP_PREVIEWS))) {
    rec.proxy = null;
    await saveUpload(rec);
  }
}

async function sha256Hex(buffer) {
  const digest = await crypto.subtle.digest('SHA-256', buffer);
  return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

const b64url = (text) => btoa(unescape(encodeURIComponent(text)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

/** A JPEG small enough to send straight away, so the map updates now. Drawn
 *  through a canvas, which means it carries no EXIF at all - the coordinates
 *  ride in the metadata header instead. */
async function downscale(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, PROXY_EDGE / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(bitmap.width * scale));
  canvas.height = Math.max(1, Math.round(bitmap.height * scale));
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', PROXY_QUALITY));
}

/** Read one picked file into the local queue. Nothing is sent yet.
 *
 *  Null when the bytes turn out to be ones this device has already handed over.
 *  The digest is taken before the photo is decoded and downscaled, so that
 *  answer costs a read rather than a re-encode - and it is the check that
 *  catches a phone which hands over the same photo under a new name each time,
 *  which the cheap fingerprint cannot see. */
async function stage(file) {
  const digest = await sha256Hex(await file.arrayBuffer());
  if (sent.has(hashKey(digest))) return null;
  const meta = (typeof readExif === 'function' ? await readExif(file) : null) || {};
  const proxy = await downscale(file);
  if (!proxy) throw new Error('could not read that photo');
  const ext = (file.name.match(/\.[A-Za-z0-9]+$/) || ['.jpg'])[0].toLowerCase();
  const rec = {
    id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
    queued_ts: Date.now(),
    name: file.name,
    file_key: fileKey(file),
    ext,
    bytes: file.size,
    sha256: digest,
    proxy_sha256: await sha256Hex(await proxy.arrayBuffer()),
    taken_ts: meta.taken_ts ?? null,
    lat: meta.lat ?? null,
    lon: meta.lon ?? null,
    proxy,
    full: file,
    iid: null,
    state: 'queued',
  };
  uploads.push(rec);
  await saveUpload(rec);
  return rec;
}

/** The one place that decides what the chips say. Called after every state
 *  change, so "uploads are paused" cannot be left on screen once it is untrue. */
function paintUploads() {
  const chip = $('upstate');
  const queued = uploads.filter((u) => u.state !== 'done').length;
  const failed = uploads.filter((u) => u.state === 'failed').length;
  const waiting = uploads.length;
  if (picking) {
    // The bar carries the detail while a batch runs; the chip only has to say
    // that one is running, since the bar is the thing being looked at.
    chip.textContent = `Reading ${fmtNum(picking.done)} of ${fmtNum(picking.total)}…`;
    chip.className = 'chip';
  } else if (failed) {
    // Never left as "uploading…": a photo that has failed is not on its way, and
    // saying it is is how a broken queue stays invisible.
    chip.textContent = `${fmtNum(failed)} could not be sent`;
    chip.className = 'chip warn';
  } else if (uploadsFull) {
    chip.textContent = 'Uploads paused - sync your computer';
    chip.className = 'chip warn';
  } else if (queued) {
    chip.textContent = `Uploading ${fmtNum(queued)}…`;
    chip.className = 'chip';
  } else if (waiting) {
    // Not "waiting for your computer", which reads as a fault when the computer
    // is right there and switched on. Nothing happens until Photo Map runs a
    // sync, and that is the sentence worth putting on screen.
    chip.textContent = `${fmtNum(waiting)} sent · run a sync on your computer`;
    chip.className = 'chip';
  } else {
    chip.className = 'chip hidden';
  }
  // The sheet is shut most of the time, so the tab that opens it carries the dot.
  $('filterBtn').classList.toggle('alert', !!(failed || uploadsFull));
  if (view === 'gallery') drawUploadTray();
}

/** Added here, but with nowhere to be drawn yet.
 *
 *  A pin needs coordinates, and this reads them out of the file itself: a JPEG
 *  with GPS in its EXIF pins immediately. Anything else - a HEIC, which is not
 *  JPEG APP1 and which exif.js declines, or a photo a phone handed over with the
 *  location stripped - has none to read, so there is nothing to place. The
 *  desktop re-reads every file it receives with Pillow and fills them in, which
 *  is why these appear on the map a sync later rather than never. */
const unplaced = () => uploads.filter((u) => u.lat == null).length;

// What the bar is showing. `of` is 0 while a step reports no fraction of its
// own - reading one photo - which is what puts the bar in its indeterminate
// state rather than parking it at a width that looks stopped.
const prog = { on:false, at:0, of:0, what:'', stop:false };

function paintProgress() {
  $('upbar').classList.toggle('on', prog.on);
  if (!prog.on) return;
  const pct = prog.of ? Math.min(100, Math.round((prog.at / prog.of) * 100)) : 0;
  $('upWhat').textContent = prog.what;
  $('upPct').textContent = prog.of ? `${pct}%` : '';
  $('upTrack').classList.toggle('idle', !prog.of);
  $('upFill').style.width = prog.of ? `${pct}%` : '35%';
}

function startProgress(what) {
  prog.on = true;
  prog.stop = false;
  prog.at = 0;
  prog.of = 0;
  prog.what = what;
  // The last run's verdict goes: it is about to be replaced by this one's, and
  // the two share a corner of the screen.
  $('upresult').classList.remove('on');
  paintProgress();
}

function endProgress() {
  prog.on = false;
  prog.stop = false;
  paintProgress();
}

function step(what, at, of) {
  prog.what = what;
  prog.at = at;
  prog.of = of;
  paintProgress();
}

$('upStop').onclick = () => {
  prog.stop = true;
  prog.what = 'Stopping…';
  paintProgress();
  // The photo in flight is the slow part; without this, Stop waits for a 50MB
  // original to finish before it takes effect.
  if (liveXhr) liveXhr.abort();
};

/** What happened, kept on screen until it is dismissed.
 *
 *  Deliberately not a toast. A toast is three seconds long and one line wide,
 *  which is enough for "12 added" and nowhere near enough for why four photos
 *  did not go - and the why is the entire reason anyone reads this. */
function showResult(title, lines, bad, canRetry) {
  const box = $('upresult');
  box.className = `on${bad ? ' bad' : ''}`;
  box.innerHTML = `<h4>${escapeHtml(title)}</h4>`
    + (lines.length ? `<ul>${lines.map((l) => `<li>${escapeHtml(l)}</li>`).join('')}</ul>` : '')
    + `<div class="acts">${canRetry ? '<button id="upRetry">Retry</button>' : ''}`
    + '<button id="upClose">Close</button></div>';
  $('upClose').onclick = () => box.classList.remove('on');
  if (canRetry) {
    $('upRetry').onclick = () => {
      box.classList.remove('on');
      retryFailed();
    };
  }
}

/** Put every failed photo back in the queue. Nothing was lost when one failed -
 *  the record and its bytes are still here - so a retry is a state change and
 *  not a re-read of the camera roll. */
async function retryFailed() {
  const stuckRecs = uploads.filter((u) => u.state === 'failed');
  if (!stuckRecs.length) return;
  for (const rec of stuckRecs) {
    rec.state = 'queued';
    rec.error = null;
    await saveUpload(rec);
  }
  paintUploads();
  const summary = await drainUploads();
  reportDrain(summary, 'Retry');
}

/** Said once per transition into the blocked state, not once per photo: a toast
 *  per rejected upload in a batch of forty is noise, not information. */
function announceFull(pending, quota) {
  if (uploadsFull) return;
  uploadsFull = true;
  const share = quota ? ` (${Math.round((pending / quota) * 100)}% of the space used)` : '';
  toast(`Uploads paused${share}. Photos already added are waiting for your `
        + 'computer - run a sync there and adding will work again.', true);
  paintUploads();
}

// Nothing has moved for this long: the connection is not slow, it is gone. An
// absolute timeout cannot tell the two apart, and a 50MB photo over a bad signal
// is allowed to take minutes as long as it is still going somewhere.
const STALL_MS = 60000;

let liveXhr = null;               // the request in flight, so Stop can end it

/** One upload, and the two things fetch cannot do here.
 *
 *  Progress: fetch has no upload progress event. Request streaming is Chromium
 *  and HTTP/2 only, and this runs on phones, so XMLHttpRequest is the choice
 *  rather than the inheritance.
 *
 *  And the answer when it is not JSON. `r.json().catch(() => ({}))` turns a
 *  Cloudflare error page, a Worker that has no import route, and an expired
 *  session's login page into the same empty object - which is how every one of
 *  them used to arrive on screen as "could not send" and nothing else.
 *
 *  Every ending resolves rather than rejects, so a caller has one shape to read
 *  and "no answer at all" is a kind of answer rather than an exception thrown
 *  from the middle of a loop. */
function sendBytes(path, blob, meta, onProgress) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    let stall = null;
    let stalled = false;
    const done = (out) => { clearTimeout(stall); liveXhr = null; resolve(out); };
    const bump = () => {
      clearTimeout(stall);
      stall = setTimeout(() => { stalled = true; xhr.abort(); }, STALL_MS);
    };

    xhr.open('POST', path, true);
    xhr.setRequestHeader('X-Photo-Meta', b64url(JSON.stringify(meta)));
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.upload.onprogress = (e) => {
      bump();
      if (onProgress) onProgress(e.loaded, e.lengthComputable ? e.total : blob.size);
    };
    xhr.onload = () => {
      let data = null;
      try { data = JSON.parse(xhr.responseText); } catch { data = null; }
      done({
        kind: 'http',
        status: xhr.status,
        ok: xhr.status >= 200 && xhr.status < 300,
        data: data && typeof data === 'object' ? data : {},
        // Kept only when it was not JSON: this is what names the real problem
        // when the Worker never answered in the first place.
        text: data ? '' : String(xhr.responseText || '').slice(0, 400),
      });
    };
    xhr.onerror = () => done({ kind:'network', status:0, ok:false, data:{}, text:'' });
    xhr.ontimeout = () => done({ kind:'stalled', status:0, ok:false, data:{}, text:'' });
    xhr.onabort = () => done({
      kind: stalled ? 'stalled' : 'stopped', status:0, ok:false, data:{}, text:'',
    });

    liveXhr = xhr;
    bump();
    xhr.send(blob);
  });
}

const stripTags = (s) => String(s).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();

// Answers that will be exactly the same for the next photo. There is nothing to
// learn from failing three hundred times in a row, so the run stops on these and
// says why, rather than grinding through the whole camera roll.
const NO_POINT_RETRYING = new Set([401, 403, 404, 405, 429, 501]);
const isFatal = (res) => res.kind === 'network' || res.kind === 'stalled'
  || NO_POINT_RETRYING.has(res.status) || res.status >= 500;

/** Why an upload did not land, in words, and never without the status.
 *
 *  The old line was `data.error || r.statusText`, and both halves are empty for
 *  the answers this actually gets: a non-JSON body leaves the first empty, and
 *  HTTP/2 - which is what Cloudflare speaks - has no status text at all, so the
 *  second is empty always. That is why every failure read "could not send". */
function whyFailed(res) {
  if (res.kind === 'network') {
    return 'no answer from the server - the connection dropped, or the app is offline';
  }
  if (res.kind === 'stalled') {
    return `nothing sent for ${STALL_MS / 1000}s - the connection stalled`;
  }
  if (res.kind === 'stopped') return 'stopped';

  const said = String(res.data.error || '').trim();
  if (said) return `${said} (${res.status})`;

  const known = {
    401: 'the session has expired - close and reopen the app to sign in again',
    403: 'the server refused it',
    404: 'this server has no upload endpoint - deploy the Worker (wrangler deploy)',
    405: 'this server has no upload endpoint - deploy the Worker (wrangler deploy)',
    413: 'too large for the server to accept',
    429: 'too many requests at once - wait a moment, then retry',
  };
  const base = known[res.status]
    || (res.status >= 500 ? 'the server had an error' : 'the server rejected it');
  const extra = res.text ? ` - "${stripTags(res.text).slice(0, 80)}"` : '';
  return `${base} (${res.status})${extra}`;
}

/** Push whatever is queued, and say what happened.
 *
 *  Returns {sent, failed, stopped, fatal, reasons}. Two photos that failed the
 *  same way are one reason, not two lines: a camera roll that cannot reach the
 *  server has one problem, however many photos were in it. */
async function drainUploads() {
  const summary = { sent:0, failed:0, stopped:false, fatal:null, reasons:new Map() };
  if (drainUploads.busy || !navigator.onLine) return summary;
  drainUploads.busy = true;

  const note = (rec, reason) => {
    summary.failed += 1;
    summary.reasons.set(reason, (summary.reasons.get(reason) || 0) + 1);
    rec.state = 'failed';
    rec.error = reason;
  };
  // The bar belongs to whoever started it: a drain inside a pick is one step of
  // that batch, not a batch of its own, and must not reset its numbers.
  const ownBar = !prog.on;
  const pending = uploads.filter((u) => u.state !== 'done');
  if (ownBar && pending.length) startProgress('Uploading…');
  const at = (rec, loaded, total, which) => {
    const of = total ? ` · ${fmtBytes(loaded)} of ${fmtBytes(total)}` : '';
    const label = `Sending ${rec.name}${which}${of}`;
    if (ownBar) step(label, loaded, total);
    else { prog.what = label; paintProgress(); }
  };

  try {
    for (const rec of pending) {
      if (uploadsFull || prog.stop) { summary.stopped = prog.stop; break; }
      if (rec.state === 'done') continue;

      if (!rec.iid) {
        const meta = { name: rec.name, ext: rec.ext, bytes: rec.bytes, sha256: rec.sha256,
                       proxy_sha256: rec.proxy_sha256, taken_ts: rec.taken_ts,
                       lat: rec.lat, lon: rec.lon };
        const res = await sendBytes('/api/import', rec.proxy, meta,
          (loaded, total) => at(rec, loaded, total, ' (preview)'));
        if (res.status === 507) {
          announceFull(res.data.pending, res.data.quota);
          summary.fatal = res.data.error
            || 'the upload space is full - sync your computer to clear it';
          break;
        }
        if (res.kind === 'stopped') { rec.state = 'queued'; summary.stopped = true; break; }
        if (!res.ok) {
          note(rec, whyFailed(res));
          await saveUpload(rec);
          // Nothing about the next photo is different, so stop and say so once.
          if (isFatal(res)) { summary.fatal = rec.error; break; }
          continue;
        }
        rec.iid = res.data.iid;
        rec.state = 'sent';
        await saveUpload(rec);
        await remember(rec);
        paintUploads();
      }

      if (rec.full) {
        const res = await sendBytes(`/api/import/full?iid=${encodeURIComponent(rec.iid)}`,
          rec.full, { sha256: rec.sha256 },
          (loaded, total) => at(rec, loaded, total, ''));
        if (res.status === 507) {
          announceFull(res.data.pending, res.data.quota);
          summary.fatal = res.data.error
            || 'the upload space is full - sync your computer to clear it';
          break;
        }
        if (res.kind === 'stopped') { rec.state = 'sent'; summary.stopped = true; break; }
        if (res.ok) {
          // The phone keeps nothing but the record: the bytes are in the bucket
          // now, and holding a 50MB copy per photo fills the device.
          rec.full = null;
          rec.state = 'done';
          summary.sent += 1;
        } else if (res.status === 413) {
          // Too big to send. The proxy is already across, so the photo still
          // lands - at proxy resolution - and the original stays on the phone.
          rec.full = null;
          rec.state = 'done';
          rec.proxy_only = true;
          summary.sent += 1;
          summary.reasons.set(`${rec.name} was too large to send in full - the smaller copy was added`, 1);
        } else {
          // The proxy is across, so the photo is not lost either way; the
          // original is worth another pass rather than a failure.
          rec.state = 'sent';
          summary.reasons.set(`full-size copy still to send: ${whyFailed(res)}`, 1);
          await saveUpload(rec);
          if (isFatal(res)) { summary.fatal = whyFailed(res); break; }
          continue;
        }
        await saveUpload(rec);
      } else {
        rec.state = 'done';
        summary.sent += 1;
        await saveUpload(rec);
      }
    }
  } finally {
    drainUploads.busy = false;
    try {
      await trimPreviews();
    } catch {
      /* previews are a nicety; failing to drop one is not worth a message */
    }
    if (ownBar) endProgress();
    paintUploads();
    refresh();
  }
  return summary;
}

/** Turn a drain into something on screen. Silent when a routine background pass
 *  had nothing to say - opening the app should not raise a panel about the two
 *  photos it just finished sending on its own. */
function reportDrain(summary, title) {
  if (!summary) return;
  const lines = [...summary.reasons.entries()].map(([reason, n]) =>
    (n > 1 ? `${fmtNum(n)} × ${reason}` : reason));
  if (summary.fatal) {
    showResult(`Upload stopped after ${fmtNum(summary.sent)} of `
      + `${fmtNum(summary.sent + summary.failed)}`, lines, true, true);
    return;
  }
  if (summary.failed) {
    showResult(`${fmtNum(summary.failed)} photo${summary.failed === 1 ? '' : 's'} `
      + 'could not be sent', lines, true, true);
    return;
  }
  if (summary.stopped) {
    showResult(`Stopped · ${fmtNum(summary.sent)} sent`, lines, false, false);
    return;
  }
  if (title && summary.sent) {
    showResult(`${title} · ${fmtNum(summary.sent)} sent`, lines, false, false);
  }
}

/** Ask before reading a photo, so a full queue is reported before the phone
 *  spends time decoding and downscaling something it cannot send. */
async function importState() {
  try {
    const r = await fetch('/api/import/state');
    if (!r.ok) return null;
    return await r.json();
  } catch {
    return null;
  }
}

let toldSelectAll = false;

$('addPhotos').onclick = async () => {
  if (!navigator.onLine) {
    toast('Offline - adding a photo needs a connection', true);
    return;
  }
  // A second selection on top of one still being read would interleave with it,
  // and the first batch's photos are only skippable once they have been sent.
  if (picking) {
    toast(`Still reading the last batch - ${fmtNum(picking.total - picking.done)} to go`);
    return;
  }
  const state = await importState();
  if (state && state.full) { announceFull(state.pending, state.quota); return; }
  // Warned early rather than at the moment of refusal, so a long batch does not
  // get halfway through and stop.
  if (state && state.pending > state.quota * 0.5) {
    toast(`${Math.round((state.pending / state.quota) * 100)}% of the upload space is `
          + 'used. Sync your computer to clear it.');
  } else if (!toldSelectAll) {
    // Once a session. Selecting everything is the intended way to use this, and
    // nothing else on screen says that picking a photo twice is harmless.
    toldSelectAll = true;
    toast('Select everything - photos already in your library are skipped.');
  }
  uploadsFull = false;
  $('picker').click();
};

$('picker').onchange = async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  await addFiles(files);
};

/** Send everything picked that is new, and pass over everything that is not.
 *
 *  Photos are read one at a time and uploaded as they are read rather than the
 *  whole selection being decoded up front, which is what makes picking a whole
 *  camera roll reasonable: at any moment the phone is holding a handful of
 *  proxies rather than all of them.
 *
 *  Reading stops if the queue stops moving - offline, or the bucket full -
 *  instead of filling the phone with photos that have nowhere to go. What was
 *  not reached is reported, and picking again costs nothing, since by then
 *  everything sent is skipped on sight. */
async function addFiles(files) {
  if (!files.length) return;
  const queued = () => uploads.filter((u) => u.state === 'queued' || u.state === 'sent').length;
  let added = 0;
  let skipped = 0;
  let sent = 0;
  let left = 0;
  // Both maps are reasons to counts, so forty photos that failed the same way
  // are one line rather than forty.
  const unread = new Map();
  const failures = new Map();
  let fatal = null;

  let stopped = false;
  const fold = (summary) => {
    sent += summary.sent;
    summary.reasons.forEach((n, reason) =>
      failures.set(reason, (failures.get(reason) || 0) + n));
    if (summary.fatal) fatal = summary.fatal;
    if (summary.stopped) stopped = true;
    return summary;
  };

  picking = { done: 0, total: files.length };
  startProgress(`Reading ${fmtNum(files.length)} photos…`);
  paintUploads();
  try {
    for (const [i, file] of files.entries()) {
      if (prog.stop) { stopped = true; left = files.length - i; break; }
      picking.done = i + 1;
      step(`Reading ${file.name}`, i, files.length);
      if (i % 25 === 0) paintUploads();
      if (uploadsFull) {
        // The toast that announced this fired when the bucket filled, which may
        // have been a batch ago. The panel has to carry the reason itself.
        fatal = 'the upload space is full - sync your computer to clear it';
        left = files.length - i;
        break;
      }
      if (alreadyMine(file) || inLibrary(file)) { skipped += 1; continue; }

      let rec = null;
      try {
        rec = await stage(file);
      } catch (err) {
        const reason = err.message || 'could not be read';
        unread.set(reason, (unread.get(reason) || 0) + 1);
        continue;
      }
      if (rec === null) { skipped += 1; continue; }

      added += 1;
      paintUploads();
      if (queued() >= STAGE_AHEAD) {
        fold(await drainUploads());
        // Something is wrong with every upload, not with this photo. Reading on
        // would fill the phone with photos that have nowhere to go.
        if (fatal) { left = files.length - i - 1; break; }
        if (queued() >= STAGE_AHEAD) { left = files.length - i - 1; break; }
      }
    }
    // Whatever is still queued at the end of the read, including a batch that
    // never reached the staging cap at all.
    if (!fatal && !prog.stop && queued()) {
      step('Uploading…', files.length, files.length);
      fold(await drainUploads());
    }
  } finally {
    picking = null;
    endProgress();
  }

  const stillQueued = queued();
  const lines = [];
  if (skipped) lines.push(`${fmtNum(skipped)} already in your library`);
  unread.forEach((n, reason) => lines.push(`${fmtNum(n)} could not be read: ${reason}`));
  failures.forEach((n, reason) => lines.push(n > 1 ? `${fmtNum(n)} × ${reason}` : reason));
  // Ahead of the count of what was skipped over, because it is why they were.
  if (fatal && !failures.has(fatal)) lines.unshift(fatal);
  if (stillQueued && !left) {
    lines.push(`${fmtNum(stillQueued)} still queued - they go when you next open the app`);
  }
  if (left) lines.push(`${fmtNum(left)} not reached - add them again once these have gone`);
  // The question this answers is "why is it not on the map?", and it is asked
  // the moment the panel appears rather than later.
  const noPin = unplaced();
  if (sent && noPin) {
    lines.push(`${fmtNum(noPin)} have no location in the file itself, so they are not `
      + 'pinned yet - your computer reads it when it files them');
  }
  if (sent) lines.push('They join the library the next time Photo Map syncs on your computer.');

  // Stopping is a choice, not a fault, so it is not painted as one.
  const bad = !stopped && !!(fatal || unread.size || (added && !sent));
  let title;
  if (fatal) title = `Upload stopped · ${fmtNum(sent)} of ${fmtNum(added)} sent`;
  else if (stopped) title = `Stopped · ${fmtNum(sent)} of ${fmtNum(added)} sent`;
  else if (!added) title = skipped ? 'Nothing new to add' : 'Nothing added';
  else if (stillQueued) title = `${fmtNum(sent)} of ${fmtNum(added)} sent · ${fmtNum(stillQueued)} still to go`;
  else title = `${fmtNum(sent)} photo${sent === 1 ? '' : 's'} added`;

  showResult(title, lines, bad, uploads.some((u) => u.state === 'failed'));
  paintUploads();
  refresh();
}

// Back on a connection. Reported only if something went wrong: a queue that
// drains by itself the moment the signal returns is the app working, not news.
window.addEventListener('online', async () => {
  uploadsFull = false;
  reportDrain(await drainUploads(), null);
});

/** Drop the local copy of every photo the desktop has actually collected.
 *
 *  Two conditions, and both matter. The watermark alone is not enough: it moves
 *  forward on any sync, including one that ran while this phone was offline
 *  holding a batch it had never sent, and retiring those would delete the only
 *  copy of photos that never left the device. So a record is only ever retired
 *  once it has an `iid`, which it gets when the bucket has accepted it.
 *
 *  The watermark is seconds; queued_ts is milliseconds. */
async function retireDrained() {
  const mark = Number(M.import_watermark) || 0;
  if (!mark) return;
  for (const rec of [...uploads]) {
    if (!rec.iid) continue;                       // never uploaded: not ours to drop
    if (rec.queued_ts / 1000 >= mark) continue;   // the desktop has not got this far
    uploads.splice(uploads.indexOf(rec), 1);
    try {
      await dropUpload(rec);
    } catch {
      /* it reappears next boot and is retired then */
    }
  }
}

/** Offer to undo while the change is still sitting in the queue. */
function offerUndo(message, key, onUndone) {
  const t = $('toast');
  t.classList.remove('err');
  t.innerHTML = `<span>${escapeHtml(message)}</span>`;
  if (key) {
    const button = document.createElement('button');
    button.textContent = 'Undo';
    button.style.marginLeft = '10px';
    button.onclick = async () => {
      const r = await fetch('/api/change/cancel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key }),
      });
      if (r.ok) {
        toast('Undone - nothing was deleted');
        if (onUndone) onUndone();
      } else {
        const data = await r.json().catch(() => ({}));
        toast(data.error || 'Too late to undo - it already synced', true);
      }
    };
    t.appendChild(button);
  }
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = 'none'; }, 15000);
}

/** Deliberate two-step confirmation before anything is deleted. */
function askDelete(indexes) {
  return new Promise((resolve) => {
    const n = indexes.length;
    const previews = indexes.slice(0, 12)
      .map((i) => `<img src="t/${M.th[i]}.jpg" alt="">`).join('');
    const needsTyping = n > 1;
    $('confirm').innerHTML = `
      <div class="box">
        <h3>Delete ${fmtNum(n)} photo${n === 1 ? '' : 's'}?</h3>
        <div class="thumbs">${previews}${n > 12 ? `<span class="more">+${fmtNum(n - 12)} more</span>` : ''}</div>
        <p class="muted small">
          The file${n === 1 ? '' : 's'} will be moved to the recycle bin on your computer at the
          next sync, and removed from the library. You can restore ${n === 1 ? 'it' : 'them'}
          from the bin, but not from here.
        </p>
        ${needsTyping ? `<p class="small">Type <strong>${n}</strong> to confirm:</p>
          <input id="confirmCount" inputmode="numeric" autocomplete="off">` : ''}
        <div class="acts">
          <button data-x="no">Cancel</button>
          <button data-x="yes" class="danger" ${needsTyping ? 'disabled' : ''}>
            Delete ${fmtNum(n)}</button>
        </div>
      </div>`;
    $('confirm').style.display = 'flex';

    const yes = $('confirm').querySelector('[data-x=yes]');
    if (needsTyping) {
      const field = $('confirmCount');
      field.focus();
      field.oninput = () => { yes.disabled = field.value.trim() !== String(n); };
      field.onkeydown = (e) => { if (e.key === 'Enter' && !yes.disabled) yes.click(); };
    }
    const close = (answer) => { $('confirm').style.display = 'none'; resolve(answer); };
    yes.onclick = () => close(true);
    $('confirm').querySelector('[data-x=no]').onclick = () => close(false);
    $('confirm').onclick = (e) => { if (e.target.id === 'confirm') close(false); };
  });
}

async function deletePhotos(indexes) {
  if (!M.allow_delete) {
    toast('Deleting is switched off. Enable it in the app on your computer.', true);
    return;
  }
  if (indexes.length > (M.delete_cap || 200)) {
    toast(`At most ${fmtNum(M.delete_cap || 200)} photos can be deleted at once`, true);
    return;
  }
  if (!await askDelete(indexes)) return;

  const ids = indexes.map((i) => M.ids[i]);
  if (!await send({ op: 'photo_delete', photo_ids: ids, confirm_count: ids.length })) return;

  const key = send.lastKey;
  const removed = new Set(ids);
  const kept = [];
  for (let i = 0; i < M.n; i += 1) if (!removed.has(M.ids[i])) kept.push(i);
  const snapshotOf = (field) => kept.map((i) => M[field][i]);
  const restore = { ids: M.ids, lat: M.lat, lon: M.lon, ts: M.ts, th: M.th, fav: M.fav,
                    sz: M.sz, cam: M.cam, n: M.n };
  ['ids', 'lat', 'lon', 'ts', 'th', 'fav'].forEach((f) => { M[f] = snapshotOf(f); });
  if (M.sz) M.sz = kept.map((i) => restore.sz[i]);
  if (M.cam) M.cam = kept.map((i) => restore.cam[i]);
  M.n = kept.length;
  idPos = null;

  selection.clear();
  paintSel();
  refresh();
  offerUndo(`${fmtNum(ids.length)} queued for deletion`, key, () => {
    Object.assign(M, restore);
    idPos = null;
    refresh();
  });
}

// ------------------------------------------------------------------ filtering

/** The note as it stands now, including one edited on this device but not yet
 *  drained by the desktop - so a search finds what you just wrote. */
const noteOf = (i) => (M.notes ? M.notes[M.ids[i]] || '' : '');

function visible() {
  const out = [];
  const albumSet = albumFilter
    ? new Set(M.albums.find((a) => a.id === albumFilter)?.photos || [])
    : null;
  for (let i = 0; i < M.n; i += 1) {
    if (M.ts[i] > cutoff) continue;
    if (favOnly && !M.fav[i]) continue;
    if (albumSet && !albumSet.has(M.ids[i])) continue;
    // One box searches both, because "the shot with the broken bike" is a note
    // and "IMG_4021" is a filename, and nobody wants to pick first.
    if (query) {
      const name = (M.name ? M.name[i] || '' : '').toLowerCase();
      if (!name.includes(query) && !noteOf(i).toLowerCase().includes(query)) continue;
    }
    out.push(i);
  }
  return out;
}

const located = (idx) => idx.filter((i) => M.lat[i] != null);

// ----------------------------------------------------------------------- map

// Clustering builds one DOM marker per photo, so it is capped well below the
// canvas-drawn points layer. Past the cap the heat map answers the same
// question without asking the browser for 60,000 elements.
const MAX_MARKERS = 60000;
const MAX_POINTS = 120000;
const MAX_PATH = 5000;
const BASE_COLOR = '#4aa3ff';

let heatLayer = null, clusterLayer = null, pointLayer = null, pathLayer = null;
let base = 'dark', showPath = false, byDay = false, armed = false;

const map = L.map('map', {
  center:[25,10], zoom:3, maxZoom:22, worldCopyJump:true, preferCanvas:true,
  boxZoom:false,  // shift-drag is box select here, as it is on the desktop
});

const bases = {
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { attribution:'&copy; OpenStreetMap, &copy; CARTO', maxZoom:22, maxNativeZoom:20, subdomains:'abcd' }),
  streets: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution:'&copy; OpenStreetMap contributors', maxZoom:22, maxNativeZoom:19 }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution:'Imagery &copy; Esri', maxZoom:22, maxNativeZoom:19 }),
};
bases.dark.addTo(map);

function setBase(name) {
  if (!bases[name] || map.hasLayer(bases[name])) return;
  Object.values(bases).forEach((l) => map.removeLayer(l));
  bases[name].addTo(map);
  base = name;
}

/** One colour per capture day. The golden-angle step puts consecutive days on
 *  opposite sides of the wheel, so a week reads as a week and not a gradient.
 *  Same constants as the desktop, so a place looks the same in both. */
function dayColor(ts) {
  if (ts == null || !ts) return BASE_COLOR;
  const hue = ((Math.floor(ts / 86400) * 137.508) % 360 + 360) % 360;
  return `hsl(${hue}, 72%, 62%)`;
}

const albumColor = () => {
  const a = albumFilter ? M.albums.find((x) => x.id === albumFilter) : null;
  return a ? a.color : BASE_COLOR;
};

function heatOptions() {
  return {
    radius: Number($('heatRadius').value),
    blur: Number($('heatBlur').value),
    max: Math.max(0.1, (31 - Number($('heatIntensity').value)) / 10),
    minOpacity: 0.25,
    maxZoom: 12,
  };
}

function clearLayers() {
  [heatLayer, clusterLayer, pointLayer, pathLayer].forEach((l) => { if (l) map.removeLayer(l); });
  heatLayer = clusterLayer = pointLayer = pathLayer = null;
  if (uploadLayer) { map.removeLayer(uploadLayer); uploadLayer = null; }
}

/** Whether there is anything real to draw into.
 *
 *  Two different sizes have to agree, and the difference is the whole bug.
 *  leaflet.heat builds its canvas from map.getSize(), which is a value Leaflet
 *  caches and only refreshes on invalidateSize; everything else here measures
 *  the element. A container that gained its size without a resize event - the
 *  app opened in a background tab and brought forward later - leaves the cache
 *  at 0x0 while the element measures perfectly well, and the heat layer then
 *  calls getImageData on a zero-width canvas and throws. Reconciling the two
 *  here is cheaper than every caller remembering which size it wants. */
function mapReady() {
  const box = map.getContainer().getBoundingClientRect();
  if (!box.width || !box.height) return false;
  if (!map.getSize().x || !map.getSize().y) map.invalidateSize();
  return map.getSize().x > 0 && map.getSize().y > 0;
}

/** Photos added on this phone, drawn over the snapshot in amber so a photo that
 *  has not reached the library yet is never mistaken for one that has. They
 *  follow the date and search filters; album and favourite belong to neither. */
/** What the map cannot say for itself about photos added on this device: how
 *  many are pinned, and how many are here but have no coordinates to be pinned
 *  by. Without the second number a photo that uploaded perfectly well simply is
 *  not on the map, with nothing anywhere saying why. */
function addedTail() {
  if (!uploads.length) return '';
  const noPin = unplaced();
  const bits = [];
  if (uploads.length - noPin) bits.push(`${fmtNum(uploads.length - noPin)} added here`);
  if (noPin) bits.push(`${fmtNum(noPin)} added, no location yet`);
  return ` · ${bits.join(' · ')}`;
}

function drawUploads() {
  const shown = uploads.filter((u) => u.lat != null
    && (u.taken_ts || 0) <= cutoff
    && (!query || u.name.toLowerCase().includes(query)));
  if (!shown.length) return;
  uploadLayer = L.featureGroup();
  shown.forEach((u) => {
    L.circleMarker([u.lat, u.lon], {
      radius: 6, color: '#ffb020', fillColor: '#ffb020', fillOpacity: 0.9, weight: 2,
    }).bindTooltip(`${escapeHtml(u.name)}<br><span class="muted small">${
      u.state === 'done' ? 'sent · waiting for a sync on your computer' : 'uploading…'}</span>`,
    { direction: 'top', offset: [0, -8] }).addTo(uploadLayer);
  });
  uploadLayer.addTo(map);
}

function bindPhotoEvents(layer) {
  layer.on('click', (e) => {
    const i = e.layer?.options?.photoIndex;
    if (i != null) openPhoto(i);
  });
  layer.on('mouseover', (e) => {
    const i = e.layer?.options?.photoIndex;
    if (i == null) return;
    e.layer.bindTooltip(
      `<img src="t/${M.th[i]}.jpg" width="140" alt="">`
      + `<div class="muted small">${fmtDT(M.ts[i])}</div>`,
      { direction:'top', offset:[0,-8], opacity:1 },
    ).openTooltip();
  });
}

/** How many distinct capture days the colours are separating, once they mean
 *  something. Photos with no date share the fallback colour and are not days. */
function daySuffix(idx) {
  if (!byDay) return '';
  const days = new Set();
  idx.forEach((i) => { if (M.ts[i]) days.add(Math.floor(M.ts[i] / 86400)); });
  return ` · ${fmtNum(days.size)} day${days.size === 1 ? '' : 's'}`;
}

function drawMap() {
  const shownAll = visible();
  const idx = located(shownAll);
  $('map').classList.toggle('under-globe', mode === 'globe');

  if (mode === 'globe') {
    clearLayers();
    if (!globeShow(idx)) { setStatus('Preparing the globe…'); return; }
    const on = Math.min(idx.length, MAX_POINTS);
    setStatus((idx.length
      ? `${on < idx.length ? `${fmtNum(on)} of ${fmtNum(idx.length)} on the globe` : `${fmtNum(idx.length)} located photos`}${daySuffix(idx.slice(0, on))}`
      : 'No photos with location for these filters') + addedTail());
    return;
  }
  globeHide();
  clearLayers();

  if (!mapReady()) {
    setStatus(`0 located · ${fmtNum(shownAll.length)} shown of ${fmtNum(M.n)}${addedTail()}`);
    return;
  }
  // Before the empty-snapshot return: a phone whose library has no located
  // photos at all should still see the one it just added.
  drawUploads();
  if (!idx.length) {
    setStatus(`0 located · ${fmtNum(shownAll.length)} shown of ${fmtNum(M.n)}${addedTail()}`);
    return;
  }
  const color = albumColor();
  const tail = ` · ${fmtNum(shownAll.length)} shown of ${fmtNum(M.n)}${addedTail()}`;

  if (mode === 'heat' || (mode === 'cluster' && idx.length > MAX_MARKERS)) {
    heatLayer = L.heatLayer(idx.map((i) => [M.lat[i], M.lon[i], 1]), heatOptions()).addTo(map);
    setStatus(`${fmtNum(idx.length)} located`
      + (mode === 'cluster' ? ' - too many to cluster, showing heat' : '') + tail);
  } else if (mode === 'cluster') {
    clusterLayer = L.markerClusterGroup({
      chunkedLoading:true, maxClusterRadius:45, spiderfyOnMaxZoom:true, disableClusteringAtZoom:19,
    });
    clusterLayer.addLayers(idx.map((i) => {
      const m = L.marker([M.lat[i], M.lon[i]], {
        icon: L.divIcon({ className:'pin', html:`<i style="background:${byDay ? dayColor(M.ts[i]) : color}"></i>`,
                          iconSize:[14,14], iconAnchor:[7,7] }),
      });
      m.options.photoIndex = i;
      return m;
    }));
    bindPhotoEvents(clusterLayer);
    clusterLayer.addTo(map);
    setStatus(`${fmtNum(idx.length)} located${daySuffix(idx)}${tail}`);
  } else {
    // Canvas circles rather than markers: one element for the whole layer, so
    // this is the mode that survives six figures of photos.
    const capped = Math.min(idx.length, MAX_POINTS);
    pointLayer = L.featureGroup();
    const renderer = L.canvas({ padding:0.3 });
    for (let k = 0; k < capped; k += 1) {
      const i = idx[k];
      const shade = byDay ? dayColor(M.ts[i]) : color;
      const chosen = selection.has(M.ids[i]);
      L.circleMarker([M.lat[i], M.lon[i]], {
        radius: chosen ? 6 : 4,
        color: chosen ? '#fff' : shade,
        weight: chosen ? 2 : 1,
        fillColor: shade, fillOpacity:0.75, renderer, photoIndex:i,
      }).addTo(pointLayer);
    }
    bindPhotoEvents(pointLayer);
    pointLayer.addTo(map);
    setStatus((capped < idx.length ? `${fmtNum(capped)} of ${fmtNum(idx.length)} shown`
                                   : `${fmtNum(idx.length)} located`)
      + daySuffix(idx.slice(0, capped)) + tail);
  }

  if (showPath && idx.length > 1 && idx.length <= MAX_PATH) {
    // Capture order, which is what makes the line a trip rather than a scribble.
    const ordered = [...idx].sort((a, b) => (M.ts[a] || 0) - (M.ts[b] || 0));
    pathLayer = L.polyline(ordered.map((i) => [M.lat[i], M.lon[i]]),
      { color, weight:1.5, opacity:0.6, dashArray:'4 4' }).addTo(map);
  } else if (showPath && idx.length > MAX_PATH) {
    toast(`Path hidden: ${fmtNum(idx.length)} points exceeds the ${fmtNum(MAX_PATH)} limit`);
  }
}

const setStatus = (text) => { $('status').textContent = text; };

function fit() {
  const idx = located(visible());
  if (!idx.length) return;
  let s = 90, w = 180, n = -90, e = -180;
  idx.forEach((i) => {
    s = Math.min(s, M.lat[i]); n = Math.max(n, M.lat[i]);
    w = Math.min(w, M.lon[i]); e = Math.max(e, M.lon[i]);
  });
  if (mode === 'globe') globeFit(s, w, n, e);
  else map.fitBounds([[s, w], [n, e]], { padding:[40,40], maxZoom:17 });
}

// ------------------------------------------------------------- box select

// Everything the viewer knows is already in memory, so the rectangle is
// answered here rather than by a server: the desktop has to ask, because its
// map holds only the points it has loaded.
function wireBoxSelect() {
  const container = map.getContainer();
  let start = null, box = null;

  container.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || (!armed && !e.shiftKey) || mode === 'globe') return;
    e.preventDefault();
    map.dragging.disable();
    start = map.mouseEventToContainerPoint(e);
    box = document.createElement('div');
    box.className = 'box-select';
    container.appendChild(box);
  });

  container.addEventListener('mousemove', (e) => {
    if (!start) return;
    const now = map.mouseEventToContainerPoint(e);
    box.style.left = `${Math.min(start.x, now.x)}px`;
    box.style.top = `${Math.min(start.y, now.y)}px`;
    box.style.width = `${Math.abs(now.x - start.x)}px`;
    box.style.height = `${Math.abs(now.y - start.y)}px`;
  });

  window.addEventListener('mouseup', (e) => {
    if (!start) return;
    const from = start, to = map.mouseEventToContainerPoint(e);
    start = null;
    box.remove(); box = null;
    map.dragging.enable();
    if (armed) { armed = false; $('boxSelect').classList.remove('active'); container.classList.remove('selecting'); }
    if (Math.abs(to.x - from.x) < 5 && Math.abs(to.y - from.y) < 5) return;

    const bounds = L.latLngBounds(map.containerPointToLatLng(from), map.containerPointToLatLng(to));
    const hits = located(visible()).filter((i) => bounds.contains([M.lat[i], M.lon[i]]));
    if (!hits.length) { toast('No photos in that area'); return; }
    hits.forEach((i) => selection.add(M.ids[i]));
    paintSel();
    drawMap();
    toast(`${fmtNum(hits.length)} photos selected`);
  });
}
wireBoxSelect();

// ------------------------------------------------------------------- globe

// MapLibre is around half a megabyte and most sessions never open this mode, so
// it is fetched the first time the globe is chosen rather than at boot.
const G = { lib:null, map:null, ready:false, booting:false, skin:'map', hovered:null, timer:null, tip:null };
const GLOBE_EMPTY = { type:'FeatureCollection', features:[] };
const RETINA = window.devicePixelRatio > 1 ? '@2x' : '';

const GLOBE_SKINS = {
  map: { layer:'skin-map', source:{ type:'raster', tileSize:256, maxzoom:20,
    tiles:[...'abcd'].map((s) => `https://${s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}${RETINA}.png`),
    attribution:'&copy; OpenStreetMap, &copy; CARTO' } },
  // Same tile source as the flat map's Streets basemap: a single host, no
  // retina variant - unlike CARTO, raw OSM tiles do not offer an @2x set.
  streets: { layer:'skin-streets', source:{ type:'raster', tileSize:256, maxzoom:19,
    tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
    attribution:'&copy; OpenStreetMap contributors' } },
  satellite: { layer:'skin-satellite', source:{ type:'raster', tileSize:256, maxzoom:19,
    tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
    attribution:'Imagery &copy; Esri' } },
};

const globeTint = () => (byDay ? ['get', 'c'] : BASE_COLOR);

function globeStyle() {
  const vis = (n) => (n === G.skin ? 'visible' : 'none');
  return {
    version: 8,
    // A sphere out to zoom 10, easing into mercator by 12, which is where a
    // sphere's floating-point precision runs out anyway.
    projection: { type:'globe' },
    sky: { 'sky-color':'#0a1220', 'horizon-color':'#1d3a5f', 'fog-color':'#080b11',
           'sky-horizon-blend':0.6,
           'atmosphere-blend':['interpolate',['linear'],['zoom'],0,0.9,5,0.4,8,0] },
    sources: {
      'skin-map': GLOBE_SKINS.map.source,
      'skin-streets': GLOBE_SKINS.streets.source,
      'skin-satellite': GLOBE_SKINS.satellite.source,
      photos: { type:'geojson', data:GLOBE_EMPTY },
      path: { type:'geojson', data:GLOBE_EMPTY },
      added: { type:'geojson', data:GLOBE_EMPTY },
    },
    layers: [
      { id:'unpainted', type:'background', paint:{ 'background-color':'#0d1420' } },
      { id:'skin-map', type:'raster', source:'skin-map', layout:{ visibility:vis('map') } },
      { id:'skin-streets', type:'raster', source:'skin-streets', layout:{ visibility:vis('streets') } },
      { id:'skin-satellite', type:'raster', source:'skin-satellite', layout:{ visibility:vis('satellite') } },
      // Under the points, not over them - the flat map's z-order is an accident
      // of add() order, not a choice worth reproducing, and a dashed line drawn
      // across the dots it connects reads worse than one sitting beneath them.
      { id:'path-line', type:'line', source:'path',
        layout:{ 'line-cap':'round', 'line-join':'round' },
        paint:{ 'line-color':BASE_COLOR, 'line-width':1.5, 'line-opacity':0.6,
                'line-dasharray':[4,4] } },
      { id:'photos', type:'circle', source:'photos', paint:{
          'circle-radius':['interpolate',['linear'],['zoom'],0,2.2,4,3,8,4.2,14,6],
          'circle-color':globeTint(), 'circle-opacity':0.9,
          'circle-stroke-width':['interpolate',['linear'],['zoom'],2,0,5,0.8],
          'circle-stroke-color':'rgba(0,0,0,.55)' } },
      { id:'photo-hover', type:'circle', source:'photos', filter:['==',['get','id'],-1], paint:{
          'circle-radius':['interpolate',['linear'],['zoom'],0,4.5,8,6.5,14,8.5],
          'circle-color':globeTint(), 'circle-stroke-width':2, 'circle-stroke-color':'#fff' } },
      // Photos added on this device, in the same amber the flat map pins them
      // in, and above the library so a new one is never buried under it. The
      // globe used to draw the snapshot and nothing else, so a photo added here
      // was simply missing from this mode.
      { id:'added-pins', type:'circle', source:'added', paint:{
          'circle-radius':['interpolate',['linear'],['zoom'],0,3.5,8,5.5,14,7],
          'circle-color':'#ffb020', 'circle-opacity':0.9,
          'circle-stroke-width':2, 'circle-stroke-color':'rgba(0,0,0,.55)' } },
    ],
  };
}

async function globeBoot() {
  if (G.booting || G.map) return;
  const box = $('globe');
  const rect = box.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  G.booting = true;
  try {
    if (!G.lib) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'vendor/maplibre-gl/maplibre-gl.css';
      document.head.appendChild(link);
      G.lib = await import('./vendor/maplibre-gl/maplibre-gl.mjs');
    }
    globeCreate(box);
  } catch (err) {
    // Two real cases: the file did not load, or the device has no WebGL2,
    // which MapLibre requires. Cleared here rather than left set, so a retry
    // (reopening Globe, or a network blip clearing up) gets another attempt
    // instead of the pane sitting on "Preparing the globe…" for the rest of
    // the session.
    G.booting = false;
    setStatus(`The globe is unavailable here: ${err.message}`);
  }
}

function globeCreate(box) {
  G.map = new G.lib.Map({
